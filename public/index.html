  <title>Whiteboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; touch-action: none; }
    canvas { display: block; cursor: crosshair; }
    .toolbar { backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    .tool-btn { transition: all 0.15s; }
    .tool-btn { color: #3f3f46; }
    .tool-btn.active { background: #7c3aed; color: white; }
    .tool-btn:not(.active):hover { background: rgba(124, 58, 237, 0.15); }
    input[type="range"] { -webkit-appearance: none; appearance: none; height: 6px; border-radius: 3px; background: #3f3f46; outline: none; }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #7c3aed; cursor: pointer; }
    input[type="range"]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: #7c3aed; cursor: pointer; border: none; }
    input[type="color"] { -webkit-appearance: none; border: none; padding: 0; cursor: pointer; }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 2px; }
    input[type="color"]::-webkit-color-swatch { border: 2px solid #d4d4d8; border-radius: 6px; }
    #brush-cursor {
      position: fixed; pointer-events: none; z-index: 40;
      border: none; border-radius: 50%;
      display: none; transform: translate(-50%, -50%);
    }
    #save-indicator { transition: opacity 0.3s; }
    canvas.panning { cursor: grab !important; }
    canvas.panning:active { cursor: grabbing !important; }
    .icon-palette-btn { transition: all 0.15s; color: #3f3f46; }
    .icon-palette-btn:hover { background: rgba(124, 58, 237, 0.1); }
    .icon-palette-btn.active { background: rgba(124, 58, 237, 0.15); box-shadow: 0 0 0 2px #7c3aed; }
    @media (max-width: 640px) {
      .toolbar { padding: 6px 8px !important; gap: 4px !important; }
      .tool-btn { width: 36px !important; height: 36px !important; font-size: 16px !important; }
      .desktop-label { display: none; }
      input[type="range"] { width: 60px !important; }
    }
  </style>
</head>
<body class="bg-white">
  <canvas id="canvas"></canvas>
  <div id="brush-cursor"></div>

  <div class="toolbar fixed top-3 left-1/2 -translate-x-1/2 bg-white/90 border border-zinc-300 rounded-2xl px-4 py-2 flex items-center gap-2 z-50 shadow-lg max-w-[96vw] overflow-x-auto">

    <div class="w-px h-8 bg-zinc-300 mx-1"></div>

    <div class="flex items-center gap-1">

    <div class="w-px h-8 bg-zinc-300 mx-1"></div>

    <button id="btn-undo" class="tool-btn w-10 h-10 rounded-xl flex items-center justify-center text-lg" title="Undo">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
    </button>
    <button id="btn-redo" class="tool-btn w-10 h-10 rounded-xl flex items-center justify-center text-lg" title="Redo">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
    </button>

    <div class="w-px h-8 bg-zinc-300 mx-1"></div>

    <button id="btn-clear" class="tool-btn w-10 h-10 rounded-xl flex items-center justify-center text-lg" title="Clear">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
    </button>

    <div class="w-px h-8 bg-zinc-300 mx-1"></div>

    <button id="btn-home" class="tool-btn w-10 h-10 rounded-xl flex items-center justify-center text-lg" title="Reset View (Ctrl+0)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    </button>
  </div>

  <!-- Icon palette popover -->
  <div id="icon-palette" class="toolbar fixed left-1/2 -translate-x-1/2 bg-white/90 border border-zinc-300 rounded-2xl px-3 py-3 z-50 shadow-lg hidden" style="top: 4.5rem;">
    <div id="icon-palette-grid" class="grid grid-cols-4 gap-1.5"></div>
  </div>

  <div id="zoom-indicator" class="fixed bottom-4 left-4 bg-white/90 border border-zinc-300 rounded-lg px-3 py-1.5 text-xs text-zinc-500 z-50 shadow cursor-pointer select-none" title="Click to reset zoom">
    100%
  </div>

  <div id="status-indicator" class="fixed bottom-4 right-4 bg-white/90 border border-zinc-300 rounded-lg px-3 py-1.5 text-xs text-zinc-500 z-50 opacity-0 pointer-events-none shadow transition-opacity duration-300">
    Saved
  </div>

  <div id="confirm-modal" class="fixed inset-0 z-[100] hidden items-center justify-center" style="background:rgba(0,0,0,0.4)">
    <div class="bg-white rounded-2xl shadow-xl p-6 max-w-sm mx-4 text-center">
      <p id="confirm-msg" class="text-zinc-800 text-sm mb-4"></p>
      <div class="flex gap-3 justify-center">
        <button id="confirm-cancel" class="px-4 py-2 rounded-lg border border-zinc-300 text-zinc-600 text-sm hover:bg-zinc-100">Cancel</button>
        <button id="confirm-ok" class="px-4 py-2 rounded-lg bg-red-500 text-white text-sm hover:bg-red-600">Clear</button>
      </div>
    </div>
  </div>

  <script>
    // ---- ICONS CONSTANT ----
    const ICONS = {
      star: {
        label: 'Star', fill: true,
        path: 'M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z'
      },
      heart: {
        label: 'Heart', fill: true,
        path: 'M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z'
      },
      check: {
        label: 'Check', fill: false,
        path: 'M20 6 9 17l-5-5'
      },
      cross: {
        label: 'Cross', fill: false,
        path: 'M18 6 6 18M6 6l12 12'
      },
      'arrow-up': {
        label: 'Arrow Up', fill: false,
        path: 'M12 19V5M5 12l7-7 7 7'
      },
      'arrow-right': {
        label: 'Arrow Right', fill: false,
        path: 'M5 12h14M12 5l7 7-7 7'
      },
      lightning: {
        label: 'Lightning', fill: true,
        path: 'M13 2 3 14h9l-1 8 10-12h-9l1-8z'
      },
      circle: {
        label: 'Circle', fill: false,
        path: 'M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z'
      },
      square: {
        label: 'Square', fill: false,
        path: 'M3 3h18v18H3z'
      },
      triangle: {
        label: 'Triangle', fill: true,
        path: 'M12 2l10 19H2z'
      },
      'thumbs-up': {
        label: 'Thumbs Up', fill: false,
        path: 'M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3'
      },
      smiley: {
        label: 'Smiley', fill: false,
        path: 'M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10zM8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01'
      },
      fire: {
        label: 'Fire', fill: true,
        path: 'M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z'
      },
      flag: {
        label: 'Flag', fill: false,
        path: 'M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1zM4 22v-7'
      },
      lock: {
        label: 'Lock', fill: false,
        path: 'M19 11H5a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2zM7 11V7a5 5 0 0 1 10 0v4'
      },
      warning: {
        label: 'Warning', fill: false,
        path: 'M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0zM12 9v4M12 17h.01'
      }
    };

    // ---- INIT ----
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token') || '';
    const headers = token ? { 'x-usernode-token': token } : {};

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // ---- STATE ----
    let strokes = [];
    let redoStack = [];
    let currentStroke = null;
    let tool = 'pen';
    let strokeColor = '#1c1917';
    let strokeWidth = 3;
    let isDrawing = false;
    const brushCursor = document.getElementById('brush-cursor');

    // Zoom/pan state (local only, not persisted)
    let scale = 1;
    let offsetX = 0;
    let offsetY = 0;
    const MIN_SCALE = 0.05;
    const MAX_SCALE = 20;
    let hasInitialResize = false;

    // Pan tracking
    let isPanning = false;
    let panStartX = 0;
    let panStartY = 0;
    let panStartOffsetX = 0;
    let panStartOffsetY = 0;

    // Pinch-to-zoom tracking (mobile)
    let lastPinchDist = 0;
    let lastPinchMidX = 0;
    let lastPinchMidY = 0;

    // Spacebar-hold for temporary move mode
    let previousTool = null;

    // Icon tool state
    let selectedStrokeId = null;   // id of the currently selected icon
    let selectedIconId = null;     // icon type key chosen from palette
    let iconDragMode = null;       // 'move' | 'resize' | null
    let iconDragStartWorld = null; // {x, y} world pos at drag start
    let iconDragStartData = null;  // snapshot of {x, y, size} at drag start
    let iconResizeCenterWorld = null; // {x, y} world center of icon being resized

    // ---- UTILITY ----
    function hexToRgba(hex, alpha) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
    }

    function worldToScreen(wx, wy) {
      return { x: wx * scale + offsetX, y: wy * scale + offsetY };
    }

    function screenToWorld(sx, sy) {
      return { x: (sx - offsetX) / scale, y: (sy - offsetY) / scale };
    }

    function getPos(e) {
      let sx, sy;
      if (e.touches && e.touches.length > 0) {
        sx = e.touches[0].clientX;
        sy = e.touches[0].clientY;
      } else {
        sx = e.clientX;
        sy = e.clientY;
      }
      return screenToWorld(sx, sy);
    }

    // ---- BRUSH CURSOR ----
    function updateBrushCursor() {
      const size = strokeWidth * scale;
      const displaySize = Math.max(size, 4);
      brushCursor.style.width = displaySize + 'px';
      brushCursor.style.height = displaySize + 'px';
      if (tool === 'eraser') {
        brushCursor.style.background = 'rgba(200, 200, 200, 0.5)';
        brushCursor.style.boxShadow = '0 0 0 1px rgba(160, 160, 160, 0.6)';
      } else {
        brushCursor.style.background = hexToRgba(strokeColor, 0.75);
        brushCursor.style.boxShadow = 'none';
      }
    }

    function moveBrushCursor(x, y) {
      brushCursor.style.left = x + 'px';
      brushCursor.style.top = y + 'px';
    }

    function showBrushCursor(show) {
      if (tool === 'move' || tool === 'icon') {
        brushCursor.style.display = 'none';
        canvas.style.cursor = tool === 'move' ? 'grab' : 'crosshair';
        return;
      }
      brushCursor.style.display = show ? 'block' : 'none';
      canvas.style.cursor = show ? 'none' : 'crosshair';
    }

    // ---- CANVAS RESIZE ----
    function resize() {
      const oldW = canvas.width;
      const oldH = canvas.height;
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      if (hasInitialResize && oldW && oldH) {
        offsetX += (canvas.width - oldW) / 2;
        offsetY += (canvas.height - oldH) / 2;
      }
      hasInitialResize = true;
      redrawAll();
    }

    // ---- DRAW FUNCTIONS ----
    function drawStroke(s) {
      if (s.type === 'icon') {
        if (!ICONS[s.iconId]) return;
        ctx.save();
        ctx.translate(s.x - s.size / 2, s.y - s.size / 2);
        ctx.scale(s.size / 24, s.size / 24);
        const p = new Path2D(ICONS[s.iconId].path);
        if (ICONS[s.iconId].fill) {
          ctx.fillStyle = s.color;
          ctx.fill(p);
        } else {
          ctx.strokeStyle = s.color;
          ctx.lineWidth = 2;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.stroke(p);
        }
        ctx.restore();
        return;
      }

      if (!s.points || s.points.length < 2) return;
      ctx.beginPath();
      ctx.moveTo(s.points[0].x, s.points[0].y);
      for (let i = 1; i < s.points.length; i++) {
        ctx.lineTo(s.points[i].x, s.points[i].y);
      }
      ctx.strokeStyle = s.eraser ? '#ffffff' : s.color;
      ctx.lineWidth = s.width;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      if (s.eraser) {
        ctx.globalCompositeOperation = 'destination-out';
      } else {
        ctx.globalCompositeOperation = 'source-over';
      }
      ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
    }

    function redrawAll() {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.setTransform(scale, 0, 0, scale, offsetX, offsetY);
      for (const s of strokes) {
        drawStroke(s.stroke_data || s);
      }
      ctx.setTransform(1, 0, 0, 1, 0, 0);

      // Draw selection ring and resize handle for selected icon
      if (selectedStrokeId !== null) {
        const sel = strokes.find(s => s.id === selectedStrokeId);
        if (sel) {
          const sd = sel.stroke_data || sel;
          if (sd.type === 'icon') {
            const tl = worldToScreen(sd.x - sd.size / 2, sd.y - sd.size / 2);
            const br = worldToScreen(sd.x + sd.size / 2, sd.y + sd.size / 2);
            const w = br.x - tl.x;
            const h = br.y - tl.y;

            ctx.save();
            ctx.strokeStyle = '#7c3aed';
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 3]);
            ctx.strokeRect(tl.x - 3, tl.y - 3, w + 6, h + 6);
            ctx.setLineDash([]);

            // Resize handle at bottom-right
            ctx.fillStyle = '#7c3aed';
            ctx.fillRect(br.x - 4, br.y - 4, 8, 8);
            ctx.restore();
          }
        }
      }
    }

    // ---- ZOOM / PAN ----
    function zoomAtPoint(cx, cy, newScale) {
      newScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, newScale));
      const ratio = newScale / scale;
      offsetX = cx - (cx - offsetX) * ratio;
      offsetY = cy - (cy - offsetY) * ratio;
      scale = newScale;
      updateBrushCursor();
      updateZoomIndicator();
      redrawAll();
    }

    function updateZoomIndicator() {
      document.getElementById('zoom-indicator').textContent = Math.round(scale * 100) + '%';
    }

    function resetView() {
      if (scale === 1 && offsetX === 0 && offsetY === 0) {
        showStatus('View already at default');
        return;
      }
      scale = 1;
      offsetX = 0;
      offsetY = 0;
      updateBrushCursor();
      updateZoomIndicator();
      redrawAll();
      showStatus('View reset');
    }

    // ---- TOOL MANAGEMENT ----
    function setActiveTool(newTool) {
      tool = newTool;
      document.getElementById('btn-pen').classList.toggle('active', newTool === 'pen');
      document.getElementById('btn-eraser').classList.toggle('active', newTool === 'eraser');
      document.getElementById('btn-move').classList.toggle('active', newTool === 'move');
      document.getElementById('btn-icons').classList.toggle('active', newTool === 'icon');

      // Clear icon interaction state when switching away from icon tool
      if (newTool !== 'icon') {
        selectedStrokeId = null;
        iconDragMode = null;
        document.getElementById('icon-palette').classList.add('hidden');
        redrawAll();
      }

      if (newTool === 'move') {
        canvas.style.cursor = 'grab';
        brushCursor.style.display = 'none';
        canvas.classList.add('panning');
      } else if (newTool === 'icon') {
        canvas.style.cursor = 'crosshair';
        brushCursor.style.display = 'none';
        canvas.classList.remove('panning');
      } else {
        canvas.classList.remove('panning');
        updateBrushCursor();
      }
    }

    // ---- ICON CURSOR FEEDBACK ----
    function updateIconCursor(cx, cy) {
      // Check resize handle of selected icon first
      if (selectedStrokeId !== null) {
        const sel = strokes.find(s => s.id === selectedStrokeId);
        if (sel) {
          const sd = sel.stroke_data || sel;
          if (sd.type === 'icon') {
            const hScreen = worldToScreen(sd.x + sd.size / 2, sd.y + sd.size / 2);
            if (Math.abs(cx - hScreen.x) <= 10 && Math.abs(cy - hScreen.y) <= 10) {
              canvas.style.cursor = 'nwse-resize';
              return;
            }
          }
        }
      }
      // Check any icon hit
      const wp = screenToWorld(cx, cy);
      for (let i = strokes.length - 1; i >= 0; i--) {
        const s = strokes[i];
        const sd = s.stroke_data || s;
        if (sd.type !== 'icon' || !ICONS[sd.iconId]) continue;
        const half = sd.size / 2;
        if (wp.x >= sd.x - half && wp.x <= sd.x + half &&
            wp.y >= sd.y - half && wp.y <= sd.y + half) {
          canvas.style.cursor = 'move';
          return;
        }
      }
      canvas.style.cursor = 'crosshair';
    }

    // ---- ICON INTERACTION ----
    async function placeIcon(wx, wy) {
      const strokeData = {
        type: 'icon',
        iconId: selectedIconId,
        x: wx,
        y: wy,
        size: 48,
        color: strokeColor
      };
      const saved = await saveStroke(strokeData);
      if (saved) {
        strokes.push({ id: saved.id, stroke_data: strokeData });
        redoStack = [];
        redrawAll();
      }
    }

    function handleIconMousedown(clientX, clientY) {
      const wp = screenToWorld(clientX, clientY);

      // 1. Check resize handle of currently selected icon
      if (selectedStrokeId !== null) {
        const sel = strokes.find(s => s.id === selectedStrokeId);
        if (sel) {
          const sd = sel.stroke_data || sel;
          if (sd.type === 'icon') {
            const hScreen = worldToScreen(sd.x + sd.size / 2, sd.y + sd.size / 2);
            if (Math.abs(clientX - hScreen.x) <= 10 && Math.abs(clientY - hScreen.y) <= 10) {
              iconDragMode = 'resize';
              iconResizeCenterWorld = { x: sd.x, y: sd.y };
              iconDragStartData = { x: sd.x, y: sd.y, size: sd.size };
              canvas.style.cursor = 'nwse-resize';
              return;
            }
          }
        }
      }

      // 2. Hit test all icons (reverse = top-most first)
      for (let i = strokes.length - 1; i >= 0; i--) {
        const s = strokes[i];
        const sd = s.stroke_data || s;
        if (sd.type !== 'icon' || !ICONS[sd.iconId]) continue;
        const half = sd.size / 2;
        if (wp.x >= sd.x - half && wp.x <= sd.x + half &&
            wp.y >= sd.y - half && wp.y <= sd.y + half) {
          selectedStrokeId = s.id;
          iconDragMode = 'move';
          iconDragStartWorld = { x: wp.x, y: wp.y };
          iconDragStartData = { x: sd.x, y: sd.y, size: sd.size };
          canvas.style.cursor = 'grabbing';
          redrawAll();
          return;
        }
      }

      // 3. No hit — deselect and place new icon
      selectedStrokeId = null;
      redrawAll();

      if (!selectedIconId) {
        showStatus('Select an icon first');
        return;
      }
      placeIcon(wp.x, wp.y);
    }

    function handleIconMousemove(clientX, clientY) {
      if (!iconDragMode || selectedStrokeId === null) return;
      const wp = screenToWorld(clientX, clientY);
      const entry = strokes.find(s => s.id === selectedStrokeId);
      if (!entry) return;
      const sd = entry.stroke_data || entry;

      if (iconDragMode === 'move') {
        const dx = wp.x - iconDragStartWorld.x;
        const dy = wp.y - iconDragStartWorld.y;
        sd.x = iconDragStartData.x + dx;
        sd.y = iconDragStartData.y + dy;
      } else if (iconDragMode === 'resize') {
        const dist = Math.sqrt(
          (wp.x - iconResizeCenterWorld.x) ** 2 +
          (wp.y - iconResizeCenterWorld.y) ** 2
        );
        sd.size = Math.max(12, Math.min(256, dist * Math.SQRT2));
      }
      redrawAll();
    }

    async function handleIconMouseup() {
      if (!iconDragMode || selectedStrokeId === null) {
        iconDragMode = null;
        return;
      }
      const mode = iconDragMode;
      iconDragMode = null;
      canvas.style.cursor = 'crosshair';

      const entry = strokes.find(s => s.id === selectedStrokeId);
      if (entry) {
        const sd = entry.stroke_data || entry;
        const ok = await saveIconUpdate(selectedStrokeId, sd);
        if (!ok && iconDragStartData) {
          // Revert local state on failure
          sd.x = iconDragStartData.x;
          sd.y = iconDragStartData.y;
          sd.size = iconDragStartData.size;
          redrawAll();
        }
      }
    }

    async function saveIconUpdate(strokeId, strokeData) {
      try {
        const res = await fetch('/api/strokes/' + strokeId, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json', ...headers },
          body: JSON.stringify({ stroke_data: strokeData })
        });
        if (res.status === 403) {
          showStatus('Not your icon to move');
          loadStrokes();
          return false;
        }
        if (res.status === 404) {
          showStatus('Icon no longer exists');
          loadStrokes();
          return false;
        }
        return res.ok;
      } catch (err) {
        console.error('Update icon failed:', err);
        showStatus('Update failed');
        return false;
      }
    }

    // ---- PINCH HELPERS ----
    function getPinchDist(t1, t2) {
      const dx = t1.clientX - t2.clientX;
      const dy = t1.clientY - t2.clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function getPinchMid(t1, t2) {
      return { x: (t1.clientX + t2.clientX) / 2, y: (t1.clientY + t2.clientY) / 2 };
    }

    // ---- DRAWING ----
    function startDraw(e) {
      if (e.target.closest('.toolbar')) return;
      if (tool === 'move') return;
      e.preventDefault();
      isDrawing = true;
      const pos = getPos(e);
      currentStroke = {
        points: [pos],
        color: strokeColor,
        width: strokeWidth,
        eraser: tool === 'eraser'
      };
    }

    function moveDraw(e) {
      if (!isDrawing || !currentStroke) return;
      e.preventDefault();
      const pos = getPos(e);
      currentStroke.points.push(pos);

      ctx.setTransform(scale, 0, 0, scale, offsetX, offsetY);
      ctx.beginPath();
      const pts = currentStroke.points;
      if (pts.length >= 2) {
        ctx.moveTo(pts[pts.length - 2].x, pts[pts.length - 2].y);
        ctx.lineTo(pos.x, pos.y);
      }
      ctx.strokeStyle = currentStroke.eraser ? '#ffffff' : currentStroke.color;
      ctx.lineWidth = currentStroke.width;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      if (currentStroke.eraser) {
        ctx.globalCompositeOperation = 'destination-out';
      } else {
        ctx.globalCompositeOperation = 'source-over';
      }
      ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
      ctx.setTransform(1, 0, 0, 1, 0, 0);
    }

    async function endDraw(e) {
      if (!isDrawing || !currentStroke) return;
      e.preventDefault();
      if (currentStroke.points.length >= 2) {
        const strokeData = {
          points: currentStroke.points,
          color: currentStroke.color,
          width: currentStroke.width,
          eraser: currentStroke.eraser
        };
        const saved = await saveStroke(strokeData);
        if (saved) {
          strokes.push({ id: saved.id, stroke_data: strokeData });
          redoStack = [];
        }
      }
      currentStroke = null;
      isDrawing = false;
    }

    // ---- MOUSE EVENT LISTENERS ----

    canvas.addEventListener('mousedown', (e) => {
      if (e.target.closest('.toolbar')) return;
      // Middle mouse button always pans
      if (e.button === 1) {
        e.preventDefault();
        isPanning = true;
        panStartX = e.clientX;
        panStartY = e.clientY;
        panStartOffsetX = offsetX;
        panStartOffsetY = offsetY;
        canvas.style.cursor = 'grabbing';
        return;
      }
      // Left click in move mode: pan
      if (tool === 'move' && e.button === 0) {
        e.preventDefault();
        isPanning = true;
        panStartX = e.clientX;
        panStartY = e.clientY;
        panStartOffsetX = offsetX;
        panStartOffsetY = offsetY;
        canvas.style.cursor = 'grabbing';
        return;
      }
      // Icon mode
      if (tool === 'icon' && e.button === 0) {
        e.preventDefault();
        handleIconMousedown(e.clientX, e.clientY);
        return;
      }
      startDraw(e);
    });

    canvas.addEventListener('mousemove', (e) => {
      if (tool !== 'move' && tool !== 'icon') {
        moveBrushCursor(e.clientX, e.clientY);
      }
      if (isPanning) {
        offsetX = panStartOffsetX + (e.clientX - panStartX);
        offsetY = panStartOffsetY + (e.clientY - panStartY);
        redrawAll();
        return;
      }
      if (iconDragMode) {
        handleIconMousemove(e.clientX, e.clientY);
        return;
      }
      if (tool === 'icon') {
        updateIconCursor(e.clientX, e.clientY);
        return;
      }
      moveDraw(e);
    });

    canvas.addEventListener('mouseup', (e) => {
      if (isPanning) {
        isPanning = false;
        canvas.style.cursor = tool === 'move' ? 'grab' : 'crosshair';
        return;
      }
      if (iconDragMode) {
        handleIconMouseup();
        return;
      }
      endDraw(e);
    });

    canvas.addEventListener('mouseleave', (e) => {
      brushCursor.style.display = 'none';
      if (isPanning) {
        isPanning = false;
        canvas.style.cursor = tool === 'move' ? 'grab' : 'crosshair';
        return;
      }
      if (iconDragMode) {
        handleIconMouseup();
        return;
      }
      endDraw(e);
    });

    canvas.addEventListener('mouseenter', (e) => {
      if (tool === 'move') {
        canvas.style.cursor = 'grab';
      } else if (tool === 'icon') {
        updateIconCursor(e.clientX, e.clientY);
      } else {
        updateBrushCursor();
        showBrushCursor(true);
        moveBrushCursor(e.clientX, e.clientY);
      }
    });

    // Wheel: pinch-to-zoom (ctrlKey) or trackpad pan (no ctrlKey)
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (e.ctrlKey) {
        const zoomFactor = 1.01;
        const newScale = scale * Math.pow(zoomFactor, -e.deltaY);
        zoomAtPoint(e.clientX, e.clientY, newScale);
      } else {
        offsetX -= e.deltaX;
        offsetY -= e.deltaY;
        redrawAll();
      }
    }, { passive: false });

    // Double-click to reset view when in move mode
    canvas.addEventListener('dblclick', (e) => {
      if (tool === 'move') {
        e.preventDefault();
        resetView();
      }
    });

    // ---- TOUCH EVENT LISTENERS ----

    canvas.addEventListener('touchstart', (e) => {
      if (e.target.closest('.toolbar')) return;

      if (tool === 'move') {
        e.preventDefault();
        if (e.touches.length === 1) {
          isPanning = true;
          panStartX = e.touches[0].clientX;
          panStartY = e.touches[0].clientY;
          panStartOffsetX = offsetX;
          panStartOffsetY = offsetY;
        } else if (e.touches.length === 2) {
          isPanning = false;
          lastPinchDist = getPinchDist(e.touches[0], e.touches[1]);
          const mid = getPinchMid(e.touches[0], e.touches[1]);
          lastPinchMidX = mid.x;
          lastPinchMidY = mid.y;
        }
        return;
      }

      if (tool === 'icon') {
        e.preventDefault();
        if (e.touches.length === 1) {
          handleIconMousedown(e.touches[0].clientX, e.touches[0].clientY);
        }
        return;
      }

      // Drawing mode
      if (e.touches.length === 1) {
        updateBrushCursor();
        showBrushCursor(true);
        moveBrushCursor(e.touches[0].clientX, e.touches[0].clientY);
        startDraw(e);
      }
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
      if (tool === 'move') {
        e.preventDefault();
        if (e.touches.length === 1 && isPanning) {
          offsetX = panStartOffsetX + (e.touches[0].clientX - panStartX);
          offsetY = panStartOffsetY + (e.touches[0].clientY - panStartY);
          redrawAll();
        } else if (e.touches.length === 2) {
          const dist = getPinchDist(e.touches[0], e.touches[1]);
          const mid = getPinchMid(e.touches[0], e.touches[1]);

          let newScale = scale * (dist / lastPinchDist);
          newScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, newScale));
          const ratio = newScale / scale;
          offsetX = mid.x - (mid.x - offsetX) * ratio;
          offsetY = mid.y - (mid.y - offsetY) * ratio;
          scale = newScale;

          offsetX += mid.x - lastPinchMidX;
          offsetY += mid.y - lastPinchMidY;

          lastPinchDist = dist;
          lastPinchMidX = mid.x;
          lastPinchMidY = mid.y;

          updateZoomIndicator();
          redrawAll();
        }
        return;
      }

      if (tool === 'icon') {
        e.preventDefault();
        if (e.touches.length === 1 && iconDragMode) {
          handleIconMousemove(e.touches[0].clientX, e.touches[0].clientY);
        }
        return;
      }

      // Drawing mode
      if (e.touches.length === 1) {
        moveBrushCursor(e.touches[0].clientX, e.touches[0].clientY);
        moveDraw(e);
      }
    }, { passive: false });

    canvas.addEventListener('touchend', (e) => {
      if (tool === 'move') {
        isPanning = false;
        return;
      }
      if (tool === 'icon') {
        if (iconDragMode) handleIconMouseup();
        return;
      }
      brushCursor.style.display = 'none';
      endDraw(e);
    }, { passive: false });

    canvas.addEventListener('touchcancel', (e) => {
      if (tool === 'move') {
        isPanning = false;
        return;
      }
      if (tool === 'icon') {
        iconDragMode = null;
        return;
      }
      brushCursor.style.display = 'none';
      endDraw(e);
    }, { passive: false });

    // Prevent iOS Safari gesture zoom
    document.addEventListener('gesturestart', (e) => e.preventDefault());
    document.addEventListener('gesturechange', (e) => e.preventDefault());

    // ---- TOOLBAR BUTTON HANDLERS ----

    document.getElementById('btn-pen').addEventListener('click', () => setActiveTool('pen'));
    document.getElementById('btn-eraser').addEventListener('click', () => setActiveTool('eraser'));
    document.getElementById('btn-move').addEventListener('click', () => setActiveTool('move'));

    document.getElementById('btn-icons').addEventListener('click', () => {
      if (tool === 'icon') {
        // Toggle palette when already in icon mode
        document.getElementById('icon-palette').classList.toggle('hidden');
      } else {
        setActiveTool('icon');
        document.getElementById('icon-palette').classList.remove('hidden');
      }
    });

    document.getElementById('color-picker').addEventListener('input', (e) => {
      strokeColor = e.target.value;
      setActiveTool('pen');
    });

    const sizeSlider = document.getElementById('stroke-size');
    const sizeLabel = document.getElementById('size-label');
    sizeSlider.addEventListener('input', (e) => {
      strokeWidth = parseInt(e.target.value);
      sizeLabel.textContent = strokeWidth;
      updateBrushCursor();
    });

    document.getElementById('btn-undo').addEventListener('click', async () => {
      if (strokes.length === 0) return;
      const last = strokes[strokes.length - 1];
      // Clear selection if undoing the selected icon
      if (last.id === selectedStrokeId) {
        selectedStrokeId = null;
        iconDragMode = null;
      }
      if (last.id) {
        try {
          await fetch('/api/strokes/' + last.id, {
            method: 'DELETE',
            headers: { ...headers }
          });
        } catch (err) {
          console.error('Undo delete failed:', err);
        }
      }
      redoStack.push(strokes.pop());
      redrawAll();
    });

    document.getElementById('btn-redo').addEventListener('click', async () => {
      if (redoStack.length === 0) return;
      const stroke = redoStack.pop();
      const data = stroke.stroke_data || stroke;
      const saved = await saveStroke(data);
      if (saved) {
        stroke.id = saved.id;
      }
      strokes.push(stroke);
      redrawAll();
    });

    function showConfirm(msg) {
      return new Promise((resolve) => {
        const modal = document.getElementById('confirm-modal');
        document.getElementById('confirm-msg').textContent = msg;
        modal.style.display = 'flex';
        modal.classList.remove('hidden');
        function cleanup(result) {
          modal.style.display = 'none';
          modal.classList.add('hidden');
          document.getElementById('confirm-ok').removeEventListener('click', onOk);
          document.getElementById('confirm-cancel').removeEventListener('click', onCancel);
          resolve(result);
        }
        function onOk() { cleanup(true); }
        function onCancel() { cleanup(false); }
        document.getElementById('confirm-ok').addEventListener('click', onOk);
        document.getElementById('confirm-cancel').addEventListener('click', onCancel);
      });
    }

    document.getElementById('btn-clear').addEventListener('click', async () => {
      if (strokes.length === 0) return;
      const confirmed = await showConfirm('Clear the entire shared whiteboard?');
      if (!confirmed) return;
      try {
        await fetch('/api/strokes', {
          method: 'DELETE',
          headers: { ...headers }
        });
      } catch (err) {
        console.error('Clear failed:', err);
      }
      strokes = [];
      redoStack = [];
      redrawAll();
    });

    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
        e.preventDefault();
        if (e.shiftKey) {
          document.getElementById('btn-redo').click();
        } else {
          document.getElementById('btn-undo').click();
        }
      }
      // Ctrl+0 / Cmd+0 to reset zoom
      if ((e.ctrlKey || e.metaKey) && e.key === '0') {
        e.preventDefault();
        resetView();
      }
      // Escape: cancel icon drag or close palette
      if (e.key === 'Escape') {
        if (iconDragMode && selectedStrokeId !== null) {
          const entry = strokes.find(s => s.id === selectedStrokeId);
          if (entry && iconDragStartData) {
            const sd = entry.stroke_data || entry;
            sd.x = iconDragStartData.x;
            sd.y = iconDragStartData.y;
            sd.size = iconDragStartData.size;
          }
          iconDragMode = null;
          canvas.style.cursor = 'crosshair';
          redrawAll();
          e.preventDefault();
          return;
        }
        if (!document.getElementById('icon-palette').classList.contains('hidden')) {
          document.getElementById('icon-palette').classList.add('hidden');
          e.preventDefault();
          return;
        }
      }
      // Spacebar hold for temporary move mode
      if (e.key === ' ' && !e.repeat && previousTool === null) {
        e.preventDefault();
        previousTool = tool;
        setActiveTool('move');
      }
    });

    document.addEventListener('keyup', (e) => {
      if (e.key === ' ' && previousTool !== null) {
        setActiveTool(previousTool);
        previousTool = null;
      }
    });

    // Close icon palette when clicking outside
    document.addEventListener('click', (e) => {
      const palette = document.getElementById('icon-palette');
      if (!palette.classList.contains('hidden')) {
        if (!e.target.closest('#icon-palette') && !e.target.closest('#btn-icons')) {
          palette.classList.add('hidden');
        }
      }
    });

    // Home button and zoom indicator click handlers
    document.getElementById('btn-home').addEventListener('click', resetView);
    document.getElementById('zoom-indicator').addEventListener('click', resetView);

    function showStatus(text) {
      const el = document.getElementById('status-indicator');
      el.textContent = text;
      el.style.opacity = '1';
      setTimeout(() => { el.style.opacity = '0'; }, 2000);
    }

    async function saveStroke(strokeData) {
      try {
        const res = await fetch('/api/strokes', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...headers },
          body: JSON.stringify({ stroke_data: strokeData })
        });
        if (res.ok) {
          return await res.json();
        }
      } catch (err) {
        console.error('Save stroke failed:', err);
        showStatus('Save failed');
      }
      return null;
    }

    async function loadStrokes() {
      try {
        const res = await fetch('/api/strokes', { headers });
        if (!res.ok) return;
        const data = await res.json();
        strokes = data.strokes || [];
        redoStack = [];
        selectedStrokeId = null;
        iconDragMode = null;
        redrawAll();
        showStatus('Board refreshed');
      } catch (err) {
        console.error('Load failed:', err);
      }
    }

    function connectSSE() {
      const url = '/api/strokes/stream' + (token ? '?token=' + encodeURIComponent(token) : '');
      const es = new EventSource(url);

      es.addEventListener('stroke', (e) => {
        const data = JSON.parse(e.data);
        const exists = strokes.some(s => s.id === data.id);
        if (!exists) {
          const strokeData = typeof data.stroke_data === 'string' ? JSON.parse(data.stroke_data) : data.stroke_data;
          strokes.push({ id: data.id, stroke_data: strokeData });
          ctx.setTransform(scale, 0, 0, scale, offsetX, offsetY);
          drawStroke(strokeData);
          ctx.setTransform(1, 0, 0, 1, 0, 0);
        }
      });

      es.addEventListener('update', (e) => {
        const data = JSON.parse(e.data);
        const entry = strokes.find(s => s.id === data.id);
        if (entry) {
          entry.stroke_data = typeof data.stroke_data === 'string' ? JSON.parse(data.stroke_data) : data.stroke_data;
          redrawAll();
        }
      });

      es.addEventListener('undo', (e) => {
        const data = JSON.parse(e.data);
        const idx = strokes.findIndex(s => s.id === data.id);
        if (idx !== -1) {
          if (strokes[idx].id === selectedStrokeId) {
            selectedStrokeId = null;
            iconDragMode = null;
          }
          strokes.splice(idx, 1);
          redrawAll();
        }
      });

      es.addEventListener('clear', () => {
        strokes = [];
        redoStack = [];
        selectedStrokeId = null;
        iconDragMode = null;
        redrawAll();
      });

      es.onerror = () => {
        es.close();
        setTimeout(connectSSE, 3000);
      };
    }

    // ---- BUILD ICON PALETTE ----
    (function buildPalette() {
      const grid = document.getElementById('icon-palette-grid');
      for (const [id, icon] of Object.entries(ICONS)) {
        const btn = document.createElement('button');
        btn.className = 'icon-palette-btn w-10 h-10 rounded-xl flex items-center justify-center';
        btn.title = icon.label;
        btn.dataset.iconId = id;

        const fillAttr = icon.fill ? 'currentColor' : 'none';
        const strokeAttr = icon.fill ? 'none' : 'currentColor';
        btn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="${fillAttr}" stroke="${strokeAttr}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${icon.path}"/></svg>`;

        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          selectedIconId = id;
          document.querySelectorAll('.icon-palette-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          document.getElementById('icon-palette').classList.add('hidden');
          showStatus(icon.label + ' selected');
        });

        grid.appendChild(btn);
      }
    })();

    // ---- INIT ----
    window.addEventListener('resize', resize);
    resize();
    loadStrokes();
    connectSSE();
  </script>
</body>
</html>
