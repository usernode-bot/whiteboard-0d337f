    function setBackground(color) {
      applyBackground(color);
      try { localStorage.setItem(BG_KEY, color); } catch (_) {}
      document.getElementById('bg-custom').value =
        /^#[0-9a-fA-F]{6}$/.test(color) ? color : '#ffffff';
    }

    (function initBackground() {
      const swatchWrap = document.getElementById('bg-swatches');
      BG_SWATCHES.forEach((color) => {
        const sw = document.createElement('button');
        sw.type = 'button';
        sw.title = color;
        sw.style.backgroundColor = color;
        sw.className = 'w-7 h-7 rounded-md border border-zinc-300 hover:scale-110 transition-transform';
        sw.addEventListener('click', () => {
          setBackground(color);
          document.getElementById('bg-popover').classList.add('hidden');
        });
        swatchWrap.appendChild(sw);
      });

      const btnBg = document.getElementById('btn-bg');
      const popover = document.getElementById('bg-popover');
      btnBg.addEventListener('click', (e) => {
        e.stopPropagation();
        popover.classList.toggle('hidden');
        document.getElementById('color-popover').classList.add('hidden');
      });
      popover.addEventListener('click', (e) => e.stopPropagation());
      document.addEventListener('click', () => {
        popover.classList.add('hidden');
      });

      document.getElementById('bg-custom').addEventListener('input', (e) => {
        setBackground(e.target.value);
      });

      let saved;
      try { saved = localStorage.getItem(BG_KEY); } catch (_) {}
      setBackground(saved || '#ffffff');
    })();

    function showStatus(text) {
      const el = document.getElementById('status-indicator');
      el.textContent = text;
      el.style.opacity = '1';
      setTimeout(() => { el.style.opacity = '0'; }, 2000);
    }

    // --- Text tool helpers ---

    function openTextInput(screenX, screenY) {
      const textInput = document.getElementById('text-input');
      const measure = document.getElementById('text-measure');
      const worldPos = screenToWorld(screenX, screenY);
      pendingTextX = worldPos.x;
      pendingTextY = worldPos.y;
      const screenFontSize = strokeWidth * 5 * scale;
      textInput.style.fontSize = screenFontSize + 'px';
      textInput.style.color = strokeColor;
      textInput.style.left = screenX + 'px';
      textInput.style.top = (screenY - screenFontSize * 0.8) + 'px';
      textInput.style.width = '4px';
      textInput.value = '';
      textInput.style.display = 'block';
      measure.style.fontSize = screenFontSize + 'px';
      textInput.focus();
    }

    async function commitText() {
      const textInput = document.getElementById('text-input');
      if (textInput.style.display === 'none') return;
      const text = textInput.value;
      textInput.style.display = 'none';
      textInput.value = '';
      if (!text.trim()) return;
      const strokeData = {
        type: 'text',
        x: pendingTextX,
        y: pendingTextY,
        text: text,
        color: strokeColor,
        fontSize: strokeWidth * 5,
        dx: 0,
        dy: 0
      };
      const saved = await saveStroke(strokeData);
      if (saved) {
        strokes.push({ id: saved.id, stroke_data: strokeData, z_index: saved.z_index });
        recordAction({ type: 'add', id: saved.id, data: strokeData });
        sortStrokes();
        redrawAll();
      }
    }

    function discardText() {
      const textInput = document.getElementById('text-input');
      textInput.style.display = 'none';
      textInput.value = '';
    }

    const textInputEl = document.getElementById('text-input');
    const textMeasureEl = document.getElementById('text-measure');

    textInputEl.addEventListener('input', () => {
      textMeasureEl.textContent = textInputEl.value || '';
      textInputEl.style.width = Math.max(4, textMeasureEl.offsetWidth + 4) + 'px';
    });

    textInputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        commitText();
      } else if (e.key === 'Escape') {
        e.preventDefault();
        discardText();
      }
      // Stop propagation so global shortcuts (spacebar, Ctrl+Z, Ctrl+0) don't fire while typing
      e.stopPropagation();
    });

    textInputEl.addEventListener('blur', () => {
      commitText();
    });

    async function saveStroke(strokeData) {
      try {
        const res = await fetch('/api/strokes', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...headers },
          body: JSON.stringify({ stroke_data: strokeData })
        });
        if (res.ok) {
          return await res.json();
        }
      } catch (err) {
        console.error('Save stroke failed:', err);
        showStatus('Save failed');
      }
      return null;
    }

    async function loadStrokes() {
      try {
        const res = await fetch('/api/strokes', { headers });
        if (!res.ok) return;
        const data = await res.json();
        strokes = data.strokes || [];
        undoStack = [];
        redoActions = [];
        deselectLayer();
        sortStrokes();
        redrawAll();
        showStatus('Board refreshed');
      } catch (err) {
        console.error('Load failed:', err);
      }
    }

    function connectSSE() {
      const url = '/api/strokes/stream' + (token ? '?token=' + encodeURIComponent(token) : '');
      const es = new EventSource(url);

      es.addEventListener('stroke', (e) => {
        const data = JSON.parse(e.data);
        const exists = strokes.some(s => s.id === data.id);
        if (!exists) {
          const strokeData = typeof data.stroke_data === 'string' ? JSON.parse(data.stroke_data) : data.stroke_data;
          strokes.push({ id: data.id, stroke_data: strokeData, z_index: data.z_index });
          sortStrokes();
          redrawAll();
        }
      });

      es.addEventListener('update', (e) => {
        const data = JSON.parse(e.data);
        const sd = typeof data.stroke_data === 'string' ? JSON.parse(data.stroke_data) : data.stroke_data;
        const layer = strokes.find(s => s.id === data.id);
        if (layer) {
          if (sd) layer.stroke_data = sd;
          if (data.z_index != null) layer.z_index = data.z_index;
          sortStrokes();
          redrawAll();
        }
      });

      es.addEventListener('undo', (e) => {
        const data = JSON.parse(e.data);
        const idx = strokes.findIndex(s => s.id === data.id);
        if (idx !== -1) {
          if (selectedLayer && selectedLayer.id === data.id) deselectLayer();
          strokes.splice(idx, 1);
          redrawAll();
        }
      });

      es.addEventListener('clear', () => {
        strokes = [];
        undoStack = [];
        redoActions = [];
        deselectLayer();
        redrawAll();
      });

      es.onerror = () => {
        es.close();
        setTimeout(connectSSE, 3000);
      };
    }

    // --- PDF export ---

    function exportToPdf(bgColor) {
      // Redraw without the selection overlay so it isn't baked into the export.
      redrawAll(true);

      // Composite the existing canvas (transparent strokes) over chosen background
      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = canvas.width;
      exportCanvas.height = canvas.height;
      const exportCtx = exportCanvas.getContext('2d');

      if (bgColor !== null) {
        exportCtx.fillStyle = bgColor;
        exportCtx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);
      }
      exportCtx.drawImage(canvas, 0, 0);

      // Restore the on-screen selection overlay (if any).
      redrawAll();

      const dataUrl = exportCanvas.toDataURL('image/png');
      const { jsPDF } = window.jspdf;
      const w = exportCanvas.width;
      const h = exportCanvas.height;
      const orientation = w >= h ? 'landscape' : 'portrait';
      // Convert px to pt (96 dpi screen → 72 pt/inch)
      const wPt = w * 72 / 96;
      const hPt = h * 72 / 96;
      const pdf = new jsPDF({ orientation, unit: 'pt', format: [wPt, hPt] });
      pdf.addImage(dataUrl, 'PNG', 0, 0, wPt, hPt);
      pdf.save('whiteboard.pdf');
    }

    function openExportModal() {
      const modal = document.getElementById('export-modal');
      modal.style.display = 'flex';
      modal.classList.remove('hidden');
    }

    function closeExportModal() {
      const modal = document.getElementById('export-modal');
      modal.style.display = 'none';
      modal.classList.add('hidden');
    }

    document.getElementById('btn-export').addEventListener('click', openExportModal);
    document.getElementById('export-cancel').addEventListener('click', closeExportModal);
    document.getElementById('export-light').addEventListener('click', () => { closeExportModal(); exportToPdf('#ffffff'); });
    document.getElementById('export-dark-bg').addEventListener('click', () => { closeExportModal(); exportToPdf('#18181b'); });
    document.getElementById('export-transparent').addEventListener('click', () => { closeExportModal(); exportToPdf(null); });

    window.addEventListener('resize', resize);
    resize();
    loadStrokes();
    connectSSE();
  </script>
</body>
</html>
