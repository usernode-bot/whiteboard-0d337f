<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <script>
  // usernode-dev-console@1
  (function () {
    if (window.__usernodeDevConsole) return;
    window.__usernodeDevConsole = true;
    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;
      try {
        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (v instanceof Error) return (v.stack || (v.name + ': ' + v.message));
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (typeof val === 'object' && val !== null) {
            if (seen.has(val)) return '[Circular]';
            seen.add(val);
          }
          if (typeof val === 'function') return '[Function ' + (val.name || 'anonymous') + ']';
          if (val instanceof Error) return val.stack || (val.name + ': ' + val.message);
          return val;
        });
      } catch (e) { try { return String(v); } catch (_) { return '[unserializable]'; } }
    }
    function post(level, args, meta) {
      try {
        var payload = {
          sentinel: S,
          level: level,
          args: Array.prototype.slice.call(args).map(function (a) { return serialize(a); }),
          ts: Date.now(),
          url: location.href,
        };
        if (meta) for (var k in meta) payload[k] = meta[k];
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      } catch (_) {}
    }
    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };
    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Error';
      post('error', [msg], { source: e.filename || '', line: e.lineno || 0, col: e.colno || 0, kind: 'error' });
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var msg = (r && (r.stack || r.message)) || String(r);
      post('error', [msg], { kind: 'unhandledrejection' });
    });
    try { post('info', ['[dev-console ready]'], { kind: 'ready' }); } catch (_) {}
  })();
  </script>
  <script>
    // Apply saved theme before CSS loads to prevent flash
    (function() {
      var saved = localStorage.getItem('theme');
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (saved === 'dark' || (!saved && prefersDark)) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
  <title>Whiteboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; touch-action: none; }
    canvas { display: block; cursor: crosshair; }
    .toolbar { backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    .tool-btn { transition: all 0.15s; }

    :root {
      --btn-color: #3f3f46;
      --btn-hover-bg: rgba(124, 58, 237, 0.15);
      --range-bg: #3f3f46;
      --swatch-border: #d4d4d8;
    }
    .dark {
      --btn-color: #a1a1aa;
      --btn-hover-bg: rgba(167, 139, 250, 0.20);
      --range-bg: #71717a;
      --swatch-border: #52525b;
    }

    .tool-btn { color: var(--btn-color); }
    .tool-btn.active { background: #7c3aed; color: white; }
    .tool-btn:not(.active):hover { background: var(--btn-hover-bg); }
    input[type="range"] { -webkit-appearance: none; appearance: none; height: 6px; border-radius: 3px; background: var(--range-bg); outline: none; }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #7c3aed; cursor: pointer; }
    input[type="range"]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: #7c3aed; cursor: pointer; border: none; }
    input[type="color"] { -webkit-appearance: none; border: none; padding: 0; cursor: pointer; }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 2px; }
    input[type="color"]::-webkit-color-swatch { border: 2px solid var(--swatch-border); border-radius: 6px; }
    #brush-cursor {
      position: fixed; pointer-events: none; z-index: 40;
      border: none; border-radius: 50%;
      display: none; transform: translate(-50%, -50%);
    }
    #save-indicator { transition: opacity 0.3s; }
    canvas.panning { cursor: grab !important; }
    canvas.panning:active { cursor: grabbing !important; }
    #text-input {
      position: fixed;
      background: transparent;
      border: none;
      outline: none;
      padding: 0;
      margin: 0;
      z-index: 60;
      display: none;
      caret-color: currentColor;
      font-family: sans-serif;
      white-space: pre;
    }
    #text-measure {
      position: fixed;
      visibility: hidden;
      white-space: pre;
      font-family: sans-serif;
      pointer-events: none;
      top: -9999px;
    }
    @media (max-width: 640px) {
      .toolbar { padding: 6px 8px !important; gap: 4px !important; }
      .tool-btn { width: 36px !important; height: 36px !important; font-size: 16px !important; }
      .desktop-label { display: none; }
      input[type="range"] { width: 60px !important; }
    }
  </style>
</head>
<body class="bg-white dark:bg-zinc-900">
  <canvas id="canvas"></canvas>
  <div id="brush-cursor"></div>
  <input type="text" id="text-input" autocomplete="off" spellcheck="false" tabindex="-1" style="display:none">
  <span id="text-measure"></span>

  <div class="toolbar fixed top-3 left-1/2 -translate-x-1/2 bg-white/90 dark:bg-zinc-800/90 border border-zinc-300 dark:border-zinc-700 rounded-2xl px-4 py-2 flex items-center gap-2 z-50 shadow-lg max-w-[96vw] overflow-x-auto">
    <button id="btn-pen" class="tool-btn active w-10 h-10 rounded-xl flex items-center justify-center text-lg" title="Pen">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
    </button>
    <button id="btn-rainbow" class="tool-btn w-10 h-10 rounded-xl flex items-center justify-center text-lg" title="Rainbow Brush">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17a9 9 0 0 1 18 0" stroke="#ef4444"/><path d="M6 17a6 6 0 0 1 12 0" stroke="#22c55e"/><path d="M9 17a3 3 0 0 1 6 0" stroke="#3b82f6"/></svg>
    </button>
    <button id="btn-eraser" class="tool-btn w-10 h-10 rounded-xl flex items-center justify-center text-lg" title="Eraser">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
    </button>
    <button id="btn-text" class="tool-btn w-10 h-10 rounded-xl flex items-center justify-center font-bold text-base" title="Text">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
    </button>
    <button id="btn-select" class="tool-btn w-10 h-10 rounded-xl flex items-center justify-center text-lg" title="Select / Move layer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 3 7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/><path d="m13 13 6 6"/></svg>
    </button>
    <button id="btn-move" class="tool-btn w-10 h-10 rounded-xl flex items-center justify-center text-lg" title="Move / Zoom">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 9 2 12 5 15"/><polyline points="9 5 12 2 15 5"/><polyline points="15 19 12 22 9 19"/><polyline points="19 9 22 12 19 15"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="12" y1="2" x2="12" y2="22"/></svg>
    </button>
    <button id="btn-emoji" class="tool-btn w-10 h-10 rounded-xl flex items-center justify-center text-lg" title="Emoji">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
    </button>
    <button id="btn-image" class="tool-btn w-10 h-10 rounded-xl flex items-center justify-center text-lg" title="Insert image">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
    </button>
    <input type="file" id="image-input" accept="image/*" class="hidden">

    <div class="relative">
      <button id="btn-shapes" class="tool-btn w-10 h-10 rounded-xl flex items-center justify-center text-lg" title="Shapes (line, circle, square)">
        <!-- icon swapped in JS to reflect the selected shape -->
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="19" x2="19" y2="5"/></svg>
      </button>
      <div id="shapes-popover" class="hidden absolute top-12 left-0 bg-white dark:bg-zinc-800 border border-zinc-300 dark:border-zinc-700 rounded-xl p-2 shadow-lg z-[60] flex gap-1">
        <button data-shape="line" class="shape-opt tool-btn w-9 h-9 rounded-lg flex items-center justify-center" title="Line">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="19" x2="19" y2="5"/></svg>
        </button>
        <button data-shape="rect" class="shape-opt tool-btn w-9 h-9 rounded-lg flex items-center justify-center" title="Square / Rectangle">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="1"/></svg>
        </button>
        <button data-shape="circle" class="shape-opt tool-btn w-9 h-9 rounded-lg flex items-center justify-center" title="Circle / Ellipse">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/></svg>
        </button>
      </div>
    </div>

    <div class="w-px h-8 bg-zinc-300 dark:bg-zinc-600 mx-1"></div>

    <div id="layer-actions" class="hidden items-center gap-1">
      <button id="btn-front" class="tool-btn w-10 h-10 rounded-xl flex items-center justify-center" title="Bring to front">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="1"/><path d="M4 16V5a1 1 0 0 1 1-1h11"/></svg>
      </button>
      <button id="btn-back" class="tool-btn w-10 h-10 rounded-xl flex items-center justify-center" title="Send to back">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="12" height="12" rx="1"/><path d="M20 8v11a1 1 0 0 1-1 1H8"/></svg>
      </button>
      <button id="btn-delete-layer" class="tool-btn w-10 h-10 rounded-xl flex items-center justify-center text-red-500" title="Delete layer (Del)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
      </button>
    </div>

    <div class="w-px h-8 bg-zinc-300 dark:bg-zinc-600 mx-1"></div>

    <button id="btn-color" class="tool-btn w-10 h-10 rounded-xl flex items-center justify-center" title="Color">
      <span id="color-dot" class="w-5 h-5 rounded-full border-2 border-white/60 shadow-sm"></span>
    </button>

    <div class="flex items-center gap-1">
      <span class="desktop-label text-xs text-zinc-500 dark:text-zinc-400">Size</span>
      <input id="stroke-size" type="range" min="1" max="40" value="3" class="w-20">
      <span id="size-label" class="text-xs text-zinc-400 dark:text-zinc-500 w-6 text-center">3</span>
    </div>

    <div class="w-px h-8 bg-zinc-300 dark:bg-zinc-600 mx-1"></div>

    <button id="btn-undo" class="tool-btn w-10 h-10 rounded-xl flex items-center justify-center text-lg" title="Undo">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
    </button>
    <button id="btn-redo" class="tool-btn w-10 h-10 rounded-xl flex items-center justify-center text-lg" title="Redo">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
    </button>

    <div class="w-px h-8 bg-zinc-300 dark:bg-zinc-600 mx-1"></div>

    <button id="btn-clear" class="tool-btn w-10 h-10 rounded-xl flex items-center justify-center text-lg" title="Clear">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
    </button>

    <div class="w-px h-8 bg-zinc-300 dark:bg-zinc-600 mx-1"></div>

    <div class="relative">
      <button id="btn-bg" class="tool-btn w-10 h-10 rounded-xl flex items-center justify-center text-lg" title="Background color">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 11l-8-8-8.5 8.5a2 2 0 0 0 0 2.8l5.2 5.2a2 2 0 0 0 2.8 0L19 11Z"/><path d="m5 2 3 3"/><path d="M2 13h15"/><path d="M22 19a2 2 0 1 1-4 0c0-1.6 2-4 2-4s2 2.4 2 4Z"/></svg>
      </button>
      <div id="bg-popover" class="hidden absolute top-12 right-0 bg-white border border-zinc-300 rounded-xl p-3 shadow-lg z-[60] w-44">
        <p class="text-xs text-zinc-500 mb-2">Background</p>
        <div id="bg-swatches" class="grid grid-cols-4 gap-2 mb-2"></div>
        <label class="flex items-center gap-2 text-xs text-zinc-500 cursor-pointer">
          <input id="bg-custom" type="color" value="#ffffff" class="w-7 h-7 rounded-md bg-transparent">
          Custom
        </label>
      </div>
    </div>

    <button id="btn-home" class="tool-btn w-10 h-10 rounded-xl flex items-center justify-center text-lg" title="Reset View (Ctrl+0)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    </button>

    <div class="w-px h-8 bg-zinc-300 dark:bg-zinc-600 mx-1"></div>

    <button id="btn-export" class="tool-btn w-10 h-10 rounded-xl flex items-center justify-center text-lg" title="Export PDF">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    </button>

    <div class="w-px h-8 bg-zinc-300 dark:bg-zinc-600 mx-1"></div>

    <button id="btn-theme" class="tool-btn w-10 h-10 rounded-xl flex items-center justify-center text-lg" title="Toggle dark mode">
      <!-- Moon: shown in light mode, hidden in dark mode -->
      <svg class="theme-icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <!-- Sun: shown in dark mode, hidden in light mode -->
      <svg class="theme-icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </button>
  </div>

  <div id="color-popover" class="hidden fixed bg-white dark:bg-zinc-800 border border-zinc-300 dark:border-zinc-700 rounded-xl p-3 shadow-lg z-[60] w-44">
    <p class="text-xs text-zinc-500 dark:text-zinc-400 mb-2">Color</p>
    <div id="color-swatches" class="grid grid-cols-4 gap-2 mb-2"></div>
    <label class="flex items-center gap-2 text-xs text-zinc-500 dark:text-zinc-400 cursor-pointer">
      <input id="color-custom-stroke" type="color" value="#1c1917" class="w-7 h-7 rounded-md bg-transparent">
      Custom
    </label>
  </div>

  <div id="emoji-picker" class="fixed top-20 left-1/2 -translate-x-1/2 bg-white/95 border border-zinc-300 rounded-2xl p-3 z-50 shadow-lg hidden max-w-[96vw]">
    <div class="grid grid-cols-8 gap-1"></div>
  </div>

  <div id="zoom-indicator" class="fixed bottom-4 left-4 bg-white/90 dark:bg-zinc-800/90 border border-zinc-300 dark:border-zinc-700 rounded-lg px-3 py-1.5 text-xs text-zinc-500 dark:text-zinc-400 z-50 shadow cursor-pointer select-none" title="Click to reset zoom">
    100%
  </div>

  <div id="status-indicator" class="fixed bottom-4 right-4 bg-white/90 dark:bg-zinc-800/90 border border-zinc-300 dark:border-zinc-700 rounded-lg px-3 py-1.5 text-xs text-zinc-500 dark:text-zinc-400 z-50 opacity-0 pointer-events-none shadow transition-opacity duration-300">
    Saved
  </div>

  <div id="export-modal" class="fixed inset-0 z-[100] hidden items-center justify-center" style="background:rgba(0,0,0,0.4)">
    <div class="bg-white dark:bg-zinc-800 rounded-2xl shadow-xl p-6 max-w-sm mx-4 text-center">
      <p class="text-zinc-800 dark:text-zinc-100 text-sm font-medium mb-4">Export PDF — choose background</p>
      <div class="flex gap-2 justify-center mb-4 flex-wrap">
        <button id="export-light" class="px-3 py-2 rounded-lg border border-zinc-300 dark:border-zinc-600 text-zinc-700 dark:text-zinc-200 text-sm hover:bg-zinc-100 dark:hover:bg-zinc-700 flex items-center gap-2">
          <span class="w-4 h-4 rounded border border-zinc-300 bg-white inline-block flex-shrink-0"></span>Light
        </button>
        <button id="export-dark-bg" class="px-3 py-2 rounded-lg border border-zinc-300 dark:border-zinc-600 text-zinc-700 dark:text-zinc-200 text-sm hover:bg-zinc-100 dark:hover:bg-zinc-700 flex items-center gap-2">
          <span class="w-4 h-4 rounded border border-zinc-600 inline-block flex-shrink-0" style="background:#18181b"></span>Dark
        </button>
        <button id="export-transparent" class="px-3 py-2 rounded-lg border border-zinc-300 dark:border-zinc-600 text-zinc-700 dark:text-zinc-200 text-sm hover:bg-zinc-100 dark:hover:bg-zinc-700 flex items-center gap-2">
          <span class="w-4 h-4 rounded border border-zinc-300 dark:border-zinc-600 inline-block flex-shrink-0" style="background:repeating-conic-gradient(#d4d4d8 0% 25%,#ffffff 0% 50%) 0/8px 8px"></span>Transparent
        </button>
      </div>
      <button id="export-cancel" class="px-4 py-2 rounded-lg border border-zinc-300 dark:border-zinc-600 text-zinc-500 dark:text-zinc-400 text-sm hover:bg-zinc-100 dark:hover:bg-zinc-700">Cancel</button>
    </div>
  </div>

  <div id="confirm-modal" class="fixed inset-0 z-[100] hidden items-center justify-center" style="background:rgba(0,0,0,0.4)">
    <div class="bg-white dark:bg-zinc-800 rounded-2xl shadow-xl p-6 max-w-sm mx-4 text-center">
      <p id="confirm-msg" class="text-zinc-800 dark:text-zinc-100 text-sm mb-4"></p>
      <div class="flex gap-3 justify-center">
        <button id="confirm-cancel" class="px-4 py-2 rounded-lg border border-zinc-300 dark:border-zinc-600 text-zinc-600 dark:text-zinc-300 text-sm hover:bg-zinc-100 dark:hover:bg-zinc-700">Cancel</button>
        <button id="confirm-ok" class="px-4 py-2 rounded-lg bg-red-500 text-white text-sm hover:bg-red-600">Clear</button>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token') || '';
    const headers = token ? { 'x-usernode-token': token } : {};

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const DEFAULT_STROKE_LIGHT = '#1c1917';
    const DEFAULT_STROKE_DARK = '#e4e4e7';

    function isDarkMode() {
      return document.documentElement.classList.contains('dark');
    }

    let strokes = [];
    // Action-history undo/redo. Each entry: {type:'add'|'delete'|'move'|'reorder', id, ...}
    let undoStack = [];
    let redoActions = [];
    let currentStroke = null;
    // Decoded <img> cache keyed by image src / data URL.
    const imageCache = new Map();
    let tool = 'pen';

    // Selection / layer-manipulation state
    let selectedLayer = null;
    let isDraggingLayer = false;
    let dragStartWorld = { x: 0, y: 0 };
    let dragOrigDx = 0;
    let dragOrigDy = 0;
    let layerMoved = false;
    // Image resize-handle state (select tool).
    let isResizingLayer = false;
    let resizeCorner = -1;
    let resizeAnchor = { x: 0, y: 0 };
    let resizeAnchorRight = false;
    let resizeAnchorBottom = false;
    let resizeOrig = { w: 0, h: 0 };
    let resizeBefore = null;
    let resizeChanged = false;
    const RESIZE_HANDLE_R = 5;      // dot radius (screen px)
    const RESIZE_HIT_R = 16;        // grab tolerance (screen px)
    const MIN_IMAGE_PX = 16;        // smallest world size while resizing
    let isErasing = false;

    let strokeColor = isDarkMode() ? DEFAULT_STROKE_DARK : DEFAULT_STROKE_LIGHT;
    let strokeWidth = 3;
    let isDrawing = false;
    const brushCursor = document.getElementById('brush-cursor');

    // Shape tool state. When `tool === 'shape'`, `shapeType` selects which
    // primitive is drawn (line | rect | circle). A shape is defined by the
    // press point (shapeStart) and the current/release point (shapeEnd).
    let shapeType = 'line';
    let shapeStart = null;
    let shapeEnd = null;
    function isShapeTool() { return tool === 'shape'; }

    function setStrokeColor(hex) {
      strokeColor = hex;
      document.getElementById('color-dot').style.backgroundColor = hex;
      if (/^#[0-9a-fA-F]{6}$/.test(hex)) {
        document.getElementById('color-custom-stroke').value = hex;
      }
    }

    // Sync color dot with initial theme
    setStrokeColor(strokeColor);

    // Update theme toggle icon visibility
    function syncThemeIcon() {
      const dark = isDarkMode();
      document.querySelector('.theme-icon-moon').style.display = dark ? 'none' : 'block';
      document.querySelector('.theme-icon-sun').style.display = dark ? 'block' : 'none';
    }
    syncThemeIcon();

    // Zoom/pan state (local only, not persisted)
    let scale = 1;
    let offsetX = 0;
    let offsetY = 0;
    const MIN_SCALE = 0.05;
    const MAX_SCALE = 20;
    let hasInitialResize = false;


    // Pan tracking
    let isPanning = false;
    let panStartX = 0;
    let panStartY = 0;
    let panStartOffsetX = 0;
    let panStartOffsetY = 0;

    // Pinch-to-zoom tracking (mobile)
    let isPinching = false;
    let lastPinchDist = 0;
    let lastPinchMidX = 0;
    let lastPinchMidY = 0;
    let lastPinchAngle = 0;

    // Rotation state (viewport only, not persisted)
    let rotation = 0;

    // Spacebar-hold for temporary move mode
    let previousTool = null;

    // Emoji tool
    const EMOJI_SIZE = 32;
    let selectedEmoji = '😀';
    const EMOJI_LIST = [
      '😀', '😂', '😍', '😎', '🤔', '😭', '😡', '🥳',
      '👍', '👎', '👏', '🙏', '💪', '🤝', '👀', '🔥',
      '❤️', '💔', '⭐', '✨', '🎉', '🎈', '💯', '✅',
      '❌', '❓', '💡', '🚀', '🐶', '🐱', '🌈', '☀️'
    ];

    // Text tool state
    let pendingTextX = 0;
    let pendingTextY = 0;

    // Rainbow brush: hue advances this many degrees per recorded point.
    const RAINBOW_HUE_STEP = 8;
    function rainbowColor(index) {
      return 'hsl(' + (((index * RAINBOW_HUE_STEP) % 360 + 360) % 360) + ', 90%, 55%)';
    }

    function hexToRgba(hex, alpha) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
    }

    function updateBrushCursor() {
      if (tool === 'text' || tool === 'shape') {
        brushCursor.style.display = 'none';
        return;
      }
      const size = strokeWidth * scale;
      const displaySize = Math.max(size, 4);
      brushCursor.style.width = displaySize + 'px';
      brushCursor.style.height = displaySize + 'px';
      if (tool === 'eraser') {
        brushCursor.style.background = 'rgba(200, 200, 200, 0.5)';
        brushCursor.style.boxShadow = '0 0 0 1px rgba(160, 160, 160, 0.6)';
      } else if (tool === 'rainbow') {
        brushCursor.style.background = 'conic-gradient(from 0deg, #ef4444, #f59e0b, #eab308, #22c55e, #3b82f6, #8b5cf6, #ef4444)';
        brushCursor.style.boxShadow = 'none';
      } else {
        brushCursor.style.background = hexToRgba(strokeColor, 0.75);
        brushCursor.style.boxShadow = 'none';
      }
    }

    function moveBrushCursor(x, y) {
      brushCursor.style.left = x + 'px';
      brushCursor.style.top = y + 'px';
    }

    function showBrushCursor(show) {
      if (tool === 'move') {
        brushCursor.style.display = 'none';
        canvas.style.cursor = 'grab';
        return;
      }
      if (tool === 'text') {
        brushCursor.style.display = 'none';
        canvas.style.cursor = 'text';
        return;
      }
      if (tool === 'select') {
        brushCursor.style.display = 'none';
        canvas.style.cursor = 'default';
        return;
      }
      if (tool === 'shape') {
        brushCursor.style.display = 'none';
        canvas.style.cursor = 'crosshair';
        return;
      }
      brushCursor.style.display = show ? 'block' : 'none';
      canvas.style.cursor = show ? 'none' : 'crosshair';
    }

    function resize() {
      const oldW = canvas.width;
      const oldH = canvas.height;
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      if (hasInitialResize && oldW && oldH) {
        offsetX += (canvas.width - oldW) / 2;
        offsetY += (canvas.height - oldH) / 2;
      }
      hasInitialResize = true;
      redrawAll();
    }

    // Stable z-order: explicit z_index, falling back to id for legacy rows.
    function sortStrokes() {
      strokes.sort((a, b) => {
        const za = a.z_index != null ? a.z_index : (a.id || 0);
        const zb = b.z_index != null ? b.z_index : (b.id || 0);
        if (za !== zb) return za - zb;
        return (a.id || 0) - (b.id || 0);
      });
    }

    function redrawAll(noSelection) {
      sortStrokes();
      const cos = Math.cos(rotation), sin = Math.sin(rotation);
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.setTransform(scale * cos, scale * sin, -scale * sin, scale * cos, offsetX, offsetY);
      for (const s of strokes) {
        drawItem(s.stroke_data || s);
      }
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      if (!noSelection) drawSelectionOverlay();
    }

    function drawItem(item) {
      // Per-layer translation (dx/dy) so moving never rewrites point arrays.
      const dx = item.dx || 0, dy = item.dy || 0;
      ctx.save();
      ctx.translate(dx, dy);
      if (item.type === 'emoji') {
        drawEmoji(item);
      } else if (item.type === 'image') {
        drawImageItem(item);
      } else if (item.type === 'shape') {
        drawShape(item);
      } else {
        drawStroke(item);
      }
      ctx.restore();
    }

    function getImage(src) {
      let img = imageCache.get(src);
      if (!img) {
        img = new Image();
        img.onload = () => redrawAll();
        img.src = src;
        imageCache.set(src, img);
      }
      return img;
    }

    function drawImageItem(item) {
      // Tolerate the legacy {dataUrl,width,height} shape as well as the
      // canonical {src,w,h} layer shape.
      const src = item.src || item.dataUrl;
      const w = item.w != null ? item.w : item.width;
      const h = item.h != null ? item.h : item.height;
      if (!src) return;
      const img = getImage(src);
      if (img.complete && img.naturalWidth) {
        ctx.globalCompositeOperation = 'source-over';
        ctx.drawImage(img, item.x, item.y, w, h);
      }
    }

    // Render a shape primitive. `line` runs from (x0,y0) to (x1,y1); `rect`
    // and `circle` are bounded by the drag rectangle between those points
    // (circle is the ellipse inscribed in that box).
    function drawShape(s) {
      ctx.globalCompositeOperation = 'source-over';
      ctx.strokeStyle = s.color;
      ctx.lineWidth = s.width;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      if (s.shape === 'rect') {
        const x = Math.min(s.x0, s.x1);
        const y = Math.min(s.y0, s.y1);
        ctx.rect(x, y, Math.abs(s.x1 - s.x0), Math.abs(s.y1 - s.y0));
      } else if (s.shape === 'circle') {
        const cx = (s.x0 + s.x1) / 2;
        const cy = (s.y0 + s.y1) / 2;
        const rx = Math.abs(s.x1 - s.x0) / 2;
        const ry = Math.abs(s.y1 - s.y0) / 2;
        ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
      } else {
        // line (default)
        ctx.moveTo(s.x0, s.y0);
        ctx.lineTo(s.x1, s.y1);
      }
      ctx.stroke();
    }

    function drawEmoji(item) {
      ctx.globalCompositeOperation = 'source-over';
      ctx.font = item.size + 'px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(item.emoji, item.x, item.y);
    }

    function drawStroke(s) {
      if (s.type === 'text') {
        ctx.font = s.fontSize + 'px sans-serif';
        ctx.fillStyle = s.color;
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillText(s.text, s.x, s.y);
        return;
      }
      if (s.type === 'image') {
        const cacheKey = s.dataUrl.slice(0, 64);
        let img = imageCache.get(cacheKey);
        if (!img) {
          img = new Image();
          img.onload = () => redrawAll();
          img.src = s.dataUrl;
          imageCache.set(cacheKey, img);
        }
        if (img.complete && img.naturalWidth > 0) {
          ctx.globalCompositeOperation = 'source-over';
          ctx.drawImage(img, s.x, s.y, s.width, s.height);
        }
        return;
      }
      if (!s.points || s.points.length < 2) return;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.lineWidth = s.width;
      if (s.rainbow && !s.eraser) {
        ctx.globalCompositeOperation = 'source-over';
        for (let i = 1; i < s.points.length; i++) {
          ctx.beginPath();
          ctx.moveTo(s.points[i - 1].x, s.points[i - 1].y);
          ctx.lineTo(s.points[i].x, s.points[i].y);
          ctx.strokeStyle = rainbowColor(i);
          ctx.stroke();
        }
        return;
      }
      ctx.beginPath();
      ctx.moveTo(s.points[0].x, s.points[0].y);
      for (let i = 1; i < s.points.length; i++) {
        ctx.lineTo(s.points[i].x, s.points[i].y);
      }
      ctx.strokeStyle = s.eraser ? '#ffffff' : s.color;
      if (s.eraser) {
        ctx.globalCompositeOperation = 'destination-out';
      } else {
        ctx.globalCompositeOperation = 'source-over';
      }
      ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
    }

    function screenToWorld(sx, sy) {
      const dx = sx - offsetX, dy = sy - offsetY;
      const cos = Math.cos(rotation), sin = Math.sin(rotation);
      return {
        x: (dx * cos + dy * sin) / scale,
        y: (-dx * sin + dy * cos) / scale
      };
    }

    function worldToScreen(x, y) {
      const cos = Math.cos(rotation), sin = Math.sin(rotation);
      return {
        x: scale * cos * x - scale * sin * y + offsetX,
        y: scale * sin * x + scale * cos * y + offsetY
      };
    }

    // World-space axis-aligned bounding box for a layer, including its dx/dy.
    function getLayerBBox(item) {
      const dx = item.dx || 0, dy = item.dy || 0;
      if (item.type === 'text') {
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.font = item.fontSize + 'px sans-serif';
        const w = ctx.measureText(item.text || '').width;
        ctx.restore();
        // fillText uses left/alphabetic baseline at (x, y).
        return { minX: item.x + dx, minY: item.y + dy - item.fontSize, maxX: item.x + dx + w, maxY: item.y + dy + item.fontSize * 0.3 };
      }
      if (item.type === 'emoji') {
        const h = item.size / 2;
        return { minX: item.x + dx - h, minY: item.y + dy - h, maxX: item.x + dx + h, maxY: item.y + dy + h };
      }
      if (item.type === 'image') {
        const w = item.w != null ? item.w : item.width;
        const h = item.h != null ? item.h : item.height;
        return { minX: item.x + dx, minY: item.y + dy, maxX: item.x + dx + w, maxY: item.y + dy + h };
      }
      if (item.points && item.points.length) {
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        for (const p of item.points) {
          if (p.x < minX) minX = p.x;
          if (p.y < minY) minY = p.y;
          if (p.x > maxX) maxX = p.x;
          if (p.y > maxY) maxY = p.y;
        }
        const r = (item.width || 1) / 2 + 4;
        return { minX: minX + dx - r, minY: minY + dy - r, maxX: maxX + dx + r, maxY: maxY + dy + r };
      }
      return null;
    }

    // Topmost layer (highest z) whose bbox contains the world point.
    function hitTest(wx, wy) {
      for (let i = strokes.length - 1; i >= 0; i--) {
        const item = strokes[i].stroke_data || strokes[i];
        const b = getLayerBBox(item);
        if (b && wx >= b.minX && wx <= b.maxX && wy >= b.minY && wy <= b.maxY) {
          return strokes[i];
        }
      }
      return null;
    }

    function drawSelectionOverlay() {
      if (!selectedLayer) return;
      const item = selectedLayer.stroke_data || selectedLayer;
      const b = getLayerBBox(item);
      if (!b) return;
      const corners = [
        worldToScreen(b.minX, b.minY),
        worldToScreen(b.maxX, b.minY),
        worldToScreen(b.maxX, b.maxY),
        worldToScreen(b.minX, b.maxY)
      ];
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalCompositeOperation = 'source-over';
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = '#7c3aed';
      ctx.setLineDash([6, 4]);
      ctx.beginPath();
      ctx.moveTo(corners[0].x, corners[0].y);
      for (let i = 1; i < 4; i++) ctx.lineTo(corners[i].x, corners[i].y);
      ctx.closePath();
      ctx.stroke();
      ctx.setLineDash([]);

      // Images get draggable corner dots so they can be scaled.
      if (item.type === 'image') {
        for (const c of corners) {
          ctx.beginPath();
          ctx.arc(c.x, c.y, RESIZE_HANDLE_R, 0, Math.PI * 2);
          ctx.fillStyle = '#ffffff';
          ctx.fill();
          ctx.lineWidth = 1.5;
          ctx.strokeStyle = '#7c3aed';
          ctx.stroke();
        }
      }
    }

    // Screen-space corners [TL,TR,BR,BL] of the selected image, or null.
    function getSelectedImageCorners() {
      if (!selectedLayer) return null;
      const item = selectedLayer.stroke_data || selectedLayer;
      if (item.type !== 'image') return null;
      const b = getLayerBBox(item);
      if (!b) return null;
      return [
        worldToScreen(b.minX, b.minY),
        worldToScreen(b.maxX, b.minY),
        worldToScreen(b.maxX, b.maxY),
        worldToScreen(b.minX, b.maxY)
      ];
    }

    // Which corner handle (0=TL,1=TR,2=BR,3=BL) is under a screen point, or -1.
    function hitResizeHandle(sx, sy) {
      const corners = getSelectedImageCorners();
      if (!corners) return -1;
      for (let i = 0; i < 4; i++) {
        if (Math.hypot(corners[i].x - sx, corners[i].y - sy) <= RESIZE_HIT_R) return i;
      }
      return -1;
    }

    // --- Selection / layer manipulation ---

    function selectLayer(layer) {
      selectedLayer = layer;
      document.getElementById('layer-actions').classList.remove('hidden');
      document.getElementById('layer-actions').classList.add('flex');
      redrawAll();
    }

    function deselectLayer() {
      if (!selectedLayer) return;
      selectedLayer = null;
      const la = document.getElementById('layer-actions');
      la.classList.add('hidden');
      la.classList.remove('flex');
      redrawAll();
    }

    function findLayer(id) {
      return strokes.find(s => s.id === id);
    }

    async function patchLayer(id, body) {
      try {
        const res = await fetch('/api/strokes/' + id, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json', ...headers },
          body: JSON.stringify(body)
        });
        if (res.ok) return await res.json();
      } catch (err) {
        console.error('Update layer failed:', err);
      }
      return null;
    }

    function removeLayerById(id) {
      const idx = strokes.findIndex(s => s.id === id);
      if (idx !== -1) strokes.splice(idx, 1);
      if (selectedLayer && selectedLayer.id === id) deselectLayer();
      if (id) {
        fetch('/api/strokes/' + id, { method: 'DELETE', headers: { ...headers } })
          .catch(err => console.error('Delete failed:', err));
      }
      redrawAll();
    }

    function beginLayerDrag(pos) {
      const hit = hitTest(pos.x, pos.y);
      if (hit) {
        selectLayer(hit);
        isDraggingLayer = true;
        dragStartWorld = pos;
        const sd = hit.stroke_data || hit;
        dragOrigDx = sd.dx || 0;
        dragOrigDy = sd.dy || 0;
        layerMoved = false;
      } else {
        deselectLayer();
      }
    }

    function updateLayerDrag(pos) {
      if (!isDraggingLayer || !selectedLayer) return;
      const sd = selectedLayer.stroke_data || selectedLayer;
      sd.dx = dragOrigDx + (pos.x - dragStartWorld.x);
      sd.dy = dragOrigDy + (pos.y - dragStartWorld.y);
      layerMoved = true;
      redrawAll();
    }

    function endLayerDrag() {
      if (!isDraggingLayer) return;
      isDraggingLayer = false;
      if (layerMoved && selectedLayer) {
        const sd = selectedLayer.stroke_data || selectedLayer;
        recordAction({ type: 'move', id: selectedLayer.id, before: { dx: dragOrigDx, dy: dragOrigDy }, after: { dx: sd.dx || 0, dy: sd.dy || 0 } });
        patchLayer(selectedLayer.id, { stroke_data: sd });
      }
    }

    // Start scaling the selected image by dragging corner `corner`.
    // We bake any pending dx/dy translation into x/y so resize math works in
    // a single coordinate frame, and pin the diagonally-opposite corner.
    function beginResize(corner, pos) {
      if (!selectedLayer) return;
      const sd = selectedLayer.stroke_data || selectedLayer;
      if (sd.type !== 'image') return;
      // Normalize the legacy {width,height} shape to {w,h}.
      if (sd.w == null && sd.width != null) { sd.w = sd.width; sd.h = sd.height; }
      isResizingLayer = true;
      resizeCorner = corner;
      resizeChanged = false;
      resizeBefore = { x: sd.x, y: sd.y, w: sd.w, h: sd.h, dx: sd.dx || 0, dy: sd.dy || 0 };
      // Fold translation into position.
      sd.x = sd.x + (sd.dx || 0);
      sd.y = sd.y + (sd.dy || 0);
      sd.dx = 0; sd.dy = 0;
      resizeOrig = { w: sd.w, h: sd.h };
      // Anchor = opposite corner. corner: 0 TL,1 TR,2 BR,3 BL.
      resizeAnchorRight = (corner === 0 || corner === 3);   // anchor on the right
      resizeAnchorBottom = (corner === 0 || corner === 1);  // anchor on the bottom
      resizeAnchor = {
        x: resizeAnchorRight ? sd.x + sd.w : sd.x,
        y: resizeAnchorBottom ? sd.y + sd.h : sd.y
      };
    }

    function updateResize(pos) {
      if (!isResizingLayer || !selectedLayer) return;
      const sd = selectedLayer.stroke_data || selectedLayer;
      const aspect = resizeOrig.w / resizeOrig.h;
      let newW = Math.abs(pos.x - resizeAnchor.x);
      let newH = Math.abs(pos.y - resizeAnchor.y);
      // Lock aspect ratio: follow whichever axis the pointer moved further on.
      const f = Math.max(newW / resizeOrig.w, newH / resizeOrig.h);
      newW = resizeOrig.w * f;
      newH = resizeOrig.h * f;
      // Enforce a minimum so the image can't collapse to nothing.
      if (newW < MIN_IMAGE_PX || newH < MIN_IMAGE_PX) {
        if (aspect >= 1) { newW = MIN_IMAGE_PX * aspect; newH = MIN_IMAGE_PX; }
        else { newW = MIN_IMAGE_PX; newH = MIN_IMAGE_PX / aspect; }
      }
      sd.w = newW;
      sd.h = newH;
      sd.x = resizeAnchorRight ? resizeAnchor.x - newW : resizeAnchor.x;
      sd.y = resizeAnchorBottom ? resizeAnchor.y - newH : resizeAnchor.y;
      resizeChanged = true;
      redrawAll();
    }

    function endResize() {
      if (!isResizingLayer) return;
      isResizingLayer = false;
      resizeCorner = -1;
      if (resizeChanged && selectedLayer && resizeBefore) {
        const sd = selectedLayer.stroke_data || selectedLayer;
        recordAction({
          type: 'resize',
          id: selectedLayer.id,
          before: resizeBefore,
          after: { x: sd.x, y: sd.y, w: sd.w, h: sd.h, dx: sd.dx || 0, dy: sd.dy || 0 }
        });
        patchLayer(selectedLayer.id, { stroke_data: sd });
      }
      resizeBefore = null;
    }

    function eraseAt(pos) {
      const hit = hitTest(pos.x, pos.y);
      if (hit) {
        recordAction({ type: 'delete', id: hit.id, data: hit.stroke_data || hit, z_index: hit.z_index });
        removeLayerById(hit.id);
      }
    }

    function deleteSelected() {
      if (!selectedLayer) return;
      const layer = selectedLayer;
      recordAction({ type: 'delete', id: layer.id, data: layer.stroke_data || layer, z_index: layer.z_index });
      removeLayerById(layer.id);
    }

    async function reorderSelected(dir) {
      if (!selectedLayer) return;
      const before = selectedLayer.z_index;
      const res = await patchLayer(selectedLayer.id, { z_index: dir });
      if (res) {
        selectedLayer.z_index = res.z_index;
        recordAction({ type: 'reorder', id: selectedLayer.id, before, after: res.z_index });
        sortStrokes();
        redrawAll();
      }
    }

    // --- Action-history undo/redo ---

    function recordAction(a) {
      undoStack.push(a);
      redoActions = [];
    }

    async function recreateLayer(action) {
      const saved = await saveStroke(action.data);
      if (saved) {
        strokes.push({ id: saved.id, stroke_data: action.data, z_index: saved.z_index });
        action.id = saved.id; // subsequent redo/undo targets the new row
        sortStrokes();
        redrawAll();
      }
    }

    async function applyUndo(a) {
      if (a.type === 'add') {
        removeLayerById(a.id);
      } else if (a.type === 'delete') {
        await recreateLayer(a);
      } else if (a.type === 'move') {
        const l = findLayer(a.id);
        if (l) {
          const sd = l.stroke_data || l;
          sd.dx = a.before.dx; sd.dy = a.before.dy;
          patchLayer(a.id, { stroke_data: sd });
          redrawAll();
        }
      } else if (a.type === 'reorder') {
        const l = findLayer(a.id);
        if (l) {
          const res = await patchLayer(a.id, { z_index: a.before });
          if (res) l.z_index = res.z_index;
          sortStrokes();
          redrawAll();
        }
      } else if (a.type === 'resize') {
        applyGeometry(a.id, a.before);
      }
    }

    // Restore a saved image geometry snapshot {x,y,w,h,dx,dy}.
    function applyGeometry(id, g) {
      const l = findLayer(id);
      if (!l) return;
      const sd = l.stroke_data || l;
      sd.x = g.x; sd.y = g.y; sd.w = g.w; sd.h = g.h;
      sd.dx = g.dx || 0; sd.dy = g.dy || 0;
      patchLayer(id, { stroke_data: sd });
      redrawAll();
    }

    async function applyRedo(a) {
      if (a.type === 'add') {
        await recreateLayer(a);
      } else if (a.type === 'delete') {
        removeLayerById(a.id);
      } else if (a.type === 'move') {
        const l = findLayer(a.id);
        if (l) {
          const sd = l.stroke_data || l;
          sd.dx = a.after.dx; sd.dy = a.after.dy;
          patchLayer(a.id, { stroke_data: sd });
          redrawAll();
        }
      } else if (a.type === 'reorder') {
        const l = findLayer(a.id);
        if (l) {
          const res = await patchLayer(a.id, { z_index: a.after });
          if (res) l.z_index = res.z_index;
          sortStrokes();
          redrawAll();
        }
      } else if (a.type === 'resize') {
        applyGeometry(a.id, a.after);
      }
    }

    function getPos(e) {
      let sx, sy;
      if (e.touches && e.touches.length > 0) {
        sx = e.touches[0].clientX;
        sy = e.touches[0].clientY;
      } else {
        sx = e.clientX;
        sy = e.clientY;
      }
      return screenToWorld(sx, sy);
    }

    function getScreenPos(e) {
      if (e.touches && e.touches.length > 0) {
        return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      }
      return { x: e.clientX, y: e.clientY };
    }

    function zoomAtPoint(cx, cy, newScale) {
      newScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, newScale));
      const ratio = newScale / scale;
      offsetX = cx - (cx - offsetX) * ratio;
      offsetY = cy - (cy - offsetY) * ratio;
      scale = newScale;
      updateBrushCursor();
      updateZoomIndicator();
      redrawAll();
    }

    function updateZoomIndicator() {
      document.getElementById('zoom-indicator').textContent = Math.round(scale * 100) + '%';
    }

    function resetView() {
      if (scale === 1 && offsetX === 0 && offsetY === 0 && rotation === 0) {
        showStatus('View already at default');
        return;
      }
      scale = 1;
      offsetX = 0;
      offsetY = 0;
      rotation = 0;
      updateBrushCursor();
      updateZoomIndicator();
      redrawAll();
      showStatus('View reset');
    }

    function setActiveTool(newTool) {
      if (tool === 'text' && newTool !== 'text') {
        const textInput = document.getElementById('text-input');
        if (textInput.style.display !== 'none') commitText();
      }
      // Leaving the select tool clears any active selection.
      if (tool === 'select' && newTool !== 'select') deselectLayer();
      tool = newTool;
      document.getElementById('btn-pen').classList.toggle('active', newTool === 'pen');
      document.getElementById('btn-rainbow').classList.toggle('active', newTool === 'rainbow');
      document.getElementById('btn-eraser').classList.toggle('active', newTool === 'eraser');
      document.getElementById('btn-text').classList.toggle('active', newTool === 'text');
      document.getElementById('btn-select').classList.toggle('active', newTool === 'select');
      document.getElementById('btn-move').classList.toggle('active', newTool === 'move');
      document.getElementById('btn-emoji').classList.toggle('active', newTool === 'emoji');
      document.getElementById('btn-shapes').classList.toggle('active', newTool === 'shape');
      if (newTool !== 'emoji') hideEmojiPicker();
      if (newTool !== 'shape') hideShapesPopover();
      if (newTool === 'move') {
        canvas.style.cursor = 'grab';
        brushCursor.style.display = 'none';
        canvas.classList.add('panning');
      } else if (newTool === 'select') {
        canvas.style.cursor = 'default';
        brushCursor.style.display = 'none';
        canvas.classList.remove('panning');
      } else if (newTool === 'emoji') {
        canvas.classList.remove('panning');
        brushCursor.style.display = 'none';
        canvas.style.cursor = 'crosshair';
      } else if (newTool === 'text') {
        canvas.style.cursor = 'text';
        brushCursor.style.display = 'none';
        canvas.classList.remove('panning');
      } else if (newTool === 'shape') {
        canvas.classList.remove('panning');
        brushCursor.style.display = 'none';
        canvas.style.cursor = 'crosshair';
      } else {
        canvas.classList.remove('panning');
        updateBrushCursor();
      }
    }

    const emojiPicker = document.getElementById('emoji-picker');
    function buildEmojiPicker() {
      const grid = emojiPicker.querySelector('.grid');
      for (const emoji of EMOJI_LIST) {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = emoji;
        b.className = 'w-9 h-9 rounded-lg flex items-center justify-center text-xl hover:bg-zinc-100';
        b.addEventListener('click', () => {
          selectedEmoji = emoji;
          hideEmojiPicker();
        });
        grid.appendChild(b);
      }
    }
    function showEmojiPicker() { emojiPicker.classList.remove('hidden'); }
    function hideEmojiPicker() { emojiPicker.classList.add('hidden'); }
    function toggleEmojiPicker() { emojiPicker.classList.toggle('hidden'); }

    function placeEmoji(e) {
      const pos = getPos(e);
      const item = { type: 'emoji', emoji: selectedEmoji, x: pos.x, y: pos.y, size: EMOJI_SIZE, dx: 0, dy: 0 };
      saveStroke(item).then((saved) => {
        if (saved) {
          strokes.push({ id: saved.id, stroke_data: item, z_index: saved.z_index });
          recordAction({ type: 'add', id: saved.id, data: item });
          sortStrokes();
          redrawAll();
        }
      });
      setActiveTool('pen');
    }

    function getPinchDist(t1, t2) {
      const dx = t1.clientX - t2.clientX;
      const dy = t1.clientY - t2.clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function getPinchMid(t1, t2) {
      return { x: (t1.clientX + t2.clientX) / 2, y: (t1.clientY + t2.clientY) / 2 };
    }

    function getPinchAngle(t1, t2) {
      return Math.atan2(t2.clientY - t1.clientY, t2.clientX - t1.clientX);
    }

    function startDraw(e) {
      if (e.target.closest('.toolbar')) return;
      // Only freehand tools draw strokes now. Eraser deletes whole layers,
      // select moves them, and move/text/emoji/image are handled elsewhere.
      if (tool !== 'pen' && tool !== 'rainbow') return;
      e.preventDefault();
      isDrawing = true;
      const pos = getPos(e);
      if (isShapeTool()) {
        shapeStart = pos;
        shapeEnd = pos;
        currentStroke = null;
        return;
      }
      currentStroke = {
        points: [pos],
        color: strokeColor,
        width: strokeWidth,
        eraser: false,
        rainbow: tool === 'rainbow'
      };
    }

    // Re-render the live shape preview on top of the committed strokes while
    // the user drags. redrawAll() has already cleared and repainted the board.
    function drawShapePreview() {
      if (!shapeStart || !shapeEnd) return;
      const cos = Math.cos(rotation), sin = Math.sin(rotation);
      ctx.setTransform(scale * cos, scale * sin, -scale * sin, scale * cos, offsetX, offsetY);
      drawShape({
        shape: shapeType,
        x0: shapeStart.x, y0: shapeStart.y,
        x1: shapeEnd.x, y1: shapeEnd.y,
        color: strokeColor,
        width: strokeWidth
      });
      ctx.setTransform(1, 0, 0, 1, 0, 0);
    }

    function moveDraw(e) {
      if (!isDrawing) return;
      if (isShapeTool()) {
        if (!shapeStart) return;
        e.preventDefault();
        shapeEnd = getPos(e);
        redrawAll();
        drawShapePreview();
        return;
      }
      if (!currentStroke) return;
      e.preventDefault();
      const pos = getPos(e);
      currentStroke.points.push(pos);

      const cos = Math.cos(rotation), sin = Math.sin(rotation);
      ctx.setTransform(scale * cos, scale * sin, -scale * sin, scale * cos, offsetX, offsetY);
      ctx.beginPath();
      const pts = currentStroke.points;
      if (pts.length >= 2) {
        ctx.moveTo(pts[pts.length - 2].x, pts[pts.length - 2].y);
        ctx.lineTo(pos.x, pos.y);
      }
      if (currentStroke.rainbow && !currentStroke.eraser) {
        ctx.strokeStyle = rainbowColor(pts.length - 1);
      } else {
        ctx.strokeStyle = currentStroke.eraser ? '#ffffff' : currentStroke.color;
      }
      ctx.lineWidth = currentStroke.width;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      if (currentStroke.eraser) {
        ctx.globalCompositeOperation = 'destination-out';
      } else {
        ctx.globalCompositeOperation = 'source-over';
      }
      ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
      ctx.setTransform(1, 0, 0, 1, 0, 0);
    }

    async function endDraw(e) {
      if (!isDrawing) return;
      if (isShapeTool()) {
        e.preventDefault();
        isDrawing = false;
        if (shapeStart && shapeEnd) {
          const dx = shapeEnd.x - shapeStart.x;
          const dy = shapeEnd.y - shapeStart.y;
          // Ignore a click with no drag (zero-size shape).
          if (Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5) {
            const strokeData = {
              type: 'shape',
              shape: shapeType,
              x0: shapeStart.x, y0: shapeStart.y,
              x1: shapeEnd.x, y1: shapeEnd.y,
              color: strokeColor,
              width: strokeWidth
            };
            const saved = await saveStroke(strokeData);
            if (saved) {
              strokes.push({ id: saved.id, stroke_data: strokeData });
              redoStack = [];
            }
          }
        }
        shapeStart = null;
        shapeEnd = null;
        redrawAll();
        return;
      }
      if (!currentStroke) return;
      e.preventDefault();
      if (currentStroke.points.length >= 2) {
        const strokeData = {
          points: currentStroke.points,
          color: currentStroke.color,
          width: currentStroke.width,
          eraser: currentStroke.eraser,
          rainbow: currentStroke.rainbow,
          dx: 0,
          dy: 0
        };
        const saved = await saveStroke(strokeData);
        if (saved) {
          strokes.push({ id: saved.id, stroke_data: strokeData, z_index: saved.z_index });
          recordAction({ type: 'add', id: saved.id, data: strokeData });
        }
      }
      currentStroke = null;
      isDrawing = false;
    }

    // --- Mouse event listeners ---

    canvas.addEventListener('mousedown', (e) => {
      if (e.target.closest('.toolbar')) return;
      // Middle mouse button always pans
      if (e.button === 1) {
        e.preventDefault();
        isPanning = true;
        panStartX = e.clientX;
        panStartY = e.clientY;
        panStartOffsetX = offsetX;
        panStartOffsetY = offsetY;
        canvas.style.cursor = 'grabbing';
        return;
      }
      // Left click in move mode: pan
      if (tool === 'move' && e.button === 0) {
        e.preventDefault();
        isPanning = true;
        panStartX = e.clientX;
        panStartY = e.clientY;
        panStartOffsetX = offsetX;
        panStartOffsetY = offsetY;
        canvas.style.cursor = 'grabbing';
        return;
      }
      // Emoji tool: don't start a stroke on mousedown; placement happens on pointerup
      if (tool === 'emoji') {
        return;
      }
      // Left click in text mode: place text input
      if (tool === 'text' && e.button === 0) {
        e.preventDefault();
        const textInput = document.getElementById('text-input');
        if (textInput.style.display !== 'none') {
          commitText();
        }
        openTextInput(e.clientX, e.clientY);
        return;
      }
      // Select tool: resize handle → drag corner; otherwise pick / move layer
      if (tool === 'select' && e.button === 0) {
        e.preventDefault();
        const sp = getScreenPos(e);
        const corner = hitResizeHandle(sp.x, sp.y);
        if (corner !== -1) { beginResize(corner, getPos(e)); return; }
        beginLayerDrag(getPos(e));
        return;
      }
      // Object eraser: delete whole layers under the pointer
      if (tool === 'eraser' && e.button === 0) {
        e.preventDefault();
        isErasing = true;
        eraseAt(getPos(e));
        return;
      }
      startDraw(e);
    });

    // Emoji tool: place on pointerup so it works for both mouse clicks and
    // touch taps. Synthetic `click` events are unreliable on mobile when
    // touch-action is none, so we use the unified pointer event instead.
    canvas.addEventListener('pointerup', (e) => {
      if (tool !== 'emoji') return;
      if (e.target.closest('.toolbar') || e.target.closest('#emoji-picker')) return;
      placeEmoji(e);
    });

    canvas.addEventListener('mousemove', (e) => {
      if (tool !== 'move' && tool !== 'select') {
        moveBrushCursor(e.clientX, e.clientY);
      }
      if (isPanning) {
        offsetX = panStartOffsetX + (e.clientX - panStartX);
        offsetY = panStartOffsetY + (e.clientY - panStartY);
        redrawAll();
        return;
      }
      if (isResizingLayer) {
        updateResize(getPos(e));
        return;
      }
      if (isDraggingLayer) {
        updateLayerDrag(getPos(e));
        return;
      }
      // Hover feedback over resize handles of a selected image.
      if (tool === 'select') {
        const corner = hitResizeHandle(e.clientX, e.clientY);
        canvas.style.cursor = corner === 1 || corner === 3 ? 'nesw-resize'
          : corner === 0 || corner === 2 ? 'nwse-resize'
          : 'default';
      }
      if (isErasing) {
        eraseAt(getPos(e));
        return;
      }
      moveDraw(e);
    });

    canvas.addEventListener('mouseup', (e) => {
      if (isPanning) {
        isPanning = false;
        canvas.style.cursor = tool === 'move' ? 'grab' : 'crosshair';
        return;
      }
      if (isResizingLayer) { endResize(); return; }
      if (isDraggingLayer) { endLayerDrag(); return; }
      if (isErasing) { isErasing = false; return; }
      endDraw(e);
    });

    canvas.addEventListener('mouseleave', (e) => {
      brushCursor.style.display = 'none';
      if (isPanning) {
        isPanning = false;
        canvas.style.cursor = tool === 'move' ? 'grab' : 'crosshair';
        return;
      }
      if (isResizingLayer) { endResize(); return; }
      if (isDraggingLayer) { endLayerDrag(); return; }
      if (isErasing) { isErasing = false; return; }
      endDraw(e);
    });

    canvas.addEventListener('mouseenter', (e) => {
      if (tool === 'move') {
        canvas.style.cursor = 'grab';
      } else {
        updateBrushCursor();
        showBrushCursor(true);
        moveBrushCursor(e.clientX, e.clientY);
      }
    });

    // Wheel: pinch-to-zoom (ctrlKey) or trackpad pan (no ctrlKey)
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (e.ctrlKey) {
        // Pinch-to-zoom gesture (trackpad) or Ctrl+scroll (mouse).
        // Normalize deltaY across deltaMode and input device:
        //   deltaMode=1 (line, Firefox mouse wheel): deltaY≈3 → convert to pixels
        //   deltaMode=0, |deltaY|>50 (discrete mouse wheel click): use fixed step
        //   deltaMode=0, |deltaY|≤50 (trackpad): continuous formula works well
        let dy = e.deltaY;
        let newScale;
        if (e.deltaMode === 1) {
          // Line mode — Firefox mouse wheel: each notch is deltaY≈3 lines
          newScale = scale * Math.pow(1.15, -Math.sign(dy));
        } else if (Math.abs(dy) > 50) {
          // Pixel mode, large delta — discrete mouse wheel click
          newScale = scale * Math.pow(1.15, -Math.sign(dy));
        } else {
          // Pixel mode, small delta — trackpad continuous gesture
          newScale = scale * Math.pow(1.01, -dy);
        }
        zoomAtPoint(e.clientX, e.clientY, newScale);
      } else {
        // Two-finger scroll / trackpad pan / regular mouse wheel
        offsetX -= e.deltaX;
        offsetY -= e.deltaY;
        redrawAll();
      }
    }, { passive: false });

    // Double-click to reset view when in move mode
    canvas.addEventListener('dblclick', (e) => {
      if (tool === 'move') {
        e.preventDefault();
        resetView();
      }
    });

    // --- Touch event listeners ---

    canvas.addEventListener('touchstart', (e) => {
      if (e.target.closest('.toolbar')) return;

      // Two-finger gesture: enter pinch-to-zoom regardless of active tool
      if (e.touches.length === 2) {
        e.preventDefault();
        isPanning = false;
        isPinching = true;
        endDraw(e);
        showBrushCursor(false);
        lastPinchDist = getPinchDist(e.touches[0], e.touches[1]);
        lastPinchAngle = getPinchAngle(e.touches[0], e.touches[1]);
        const mid = getPinchMid(e.touches[0], e.touches[1]);
        lastPinchMidX = mid.x;
        lastPinchMidY = mid.y;
        return;
      }

      if (tool === 'text') {
        e.preventDefault();
        if (e.touches.length === 1) {
          const textInput = document.getElementById('text-input');
          if (textInput.style.display !== 'none') {
            commitText();
          }
          openTextInput(e.touches[0].clientX, e.touches[0].clientY);
        }
        return;
      }

      if (tool === 'move') {
        e.preventDefault();
        if (e.touches.length === 1) {
          isPanning = true;
          panStartX = e.touches[0].clientX;
          panStartY = e.touches[0].clientY;
          panStartOffsetX = offsetX;
          panStartOffsetY = offsetY;
        }
        return;
      }

      // Emoji tool: don't start a stroke; the pointerup handler places the emoji
      if (tool === 'emoji') {
        return;
      }

      // Select tool: resize handle → drag corner; otherwise pick / move layer
      if (tool === 'select') {
        e.preventDefault();
        if (e.touches.length === 1) {
          const sp = getScreenPos(e);
          const corner = hitResizeHandle(sp.x, sp.y);
          if (corner !== -1) beginResize(corner, getPos(e));
          else beginLayerDrag(getPos(e));
        }
        return;
      }

      // Object eraser: delete whole layers under the touch
      if (tool === 'eraser') {
        e.preventDefault();
        if (e.touches.length === 1) { isErasing = true; eraseAt(getPos(e)); }
        return;
      }

      // Drawing mode (single touch)
      if (e.touches.length === 1) {
        updateBrushCursor();
        showBrushCursor(true);
        moveBrushCursor(e.touches[0].clientX, e.touches[0].clientY);
        startDraw(e);
      }
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
      // Pinch-to-zoom: runs for all tool modes
      if (isPinching) {
        e.preventDefault();
        if (e.touches.length === 2) {
          const dist = getPinchDist(e.touches[0], e.touches[1]);
          const mid = getPinchMid(e.touches[0], e.touches[1]);
          const angle = getPinchAngle(e.touches[0], e.touches[1]);

          // Compute world point under the old midpoint (anchor stays fixed)
          const anchor = screenToWorld(lastPinchMidX, lastPinchMidY);

          // Apply scale and rotation deltas
          scale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, scale * (dist / lastPinchDist)));
          rotation += angle - lastPinchAngle;

          // Recompute offsets so anchor maps back to new midpoint
          const cos = Math.cos(rotation), sin = Math.sin(rotation);
          offsetX = mid.x - scale * (cos * anchor.x - sin * anchor.y);
          offsetY = mid.y - scale * (sin * anchor.x + cos * anchor.y);

          lastPinchDist = dist;
          lastPinchMidX = mid.x;
          lastPinchMidY = mid.y;
          lastPinchAngle = angle;

          updateZoomIndicator();
          updateBrushCursor();
          redrawAll();
        }
        return;
      }

      if (tool === 'move') {
        e.preventDefault();
        if (e.touches.length === 1 && isPanning) {
          offsetX = panStartOffsetX + (e.touches[0].clientX - panStartX);
          offsetY = panStartOffsetY + (e.touches[0].clientY - panStartY);
          redrawAll();
        }
        return;
      }

      if (tool === 'select') {
        e.preventDefault();
        if (e.touches.length === 1) {
          if (isResizingLayer) updateResize(getPos(e));
          else if (isDraggingLayer) updateLayerDrag(getPos(e));
        }
        return;
      }

      if (tool === 'eraser') {
        e.preventDefault();
        if (isErasing && e.touches.length === 1) eraseAt(getPos(e));
        return;
      }

      // Drawing mode
      if (e.touches.length === 1) {
        moveBrushCursor(e.touches[0].clientX, e.touches[0].clientY);
        moveDraw(e);
      }
    }, { passive: false });

    canvas.addEventListener('touchend', (e) => {
      if (isPinching && e.touches.length < 2) {
        isPinching = false;
        isPanning = false;
        showBrushCursor(false);
        return;
      }
      if (tool === 'move') {
        isPanning = false;
        return;
      }
      if (tool === 'select') { if (isResizingLayer) endResize(); else endLayerDrag(); return; }
      if (tool === 'eraser') { isErasing = false; return; }
      brushCursor.style.display = 'none';
      endDraw(e);
    }, { passive: false });

    canvas.addEventListener('touchcancel', (e) => {
      if (isPinching) {
        isPinching = false;
        isPanning = false;
        showBrushCursor(false);
        return;
      }
      if (tool === 'move') {
        isPanning = false;
        return;
      }
      if (tool === 'select') { if (isResizingLayer) endResize(); else endLayerDrag(); return; }
      if (tool === 'eraser') { isErasing = false; return; }
      brushCursor.style.display = 'none';
      endDraw(e);
    }, { passive: false });

    // Prevent iOS Safari gesture zoom
    document.addEventListener('gesturestart', (e) => e.preventDefault());
    document.addEventListener('gesturechange', (e) => e.preventDefault());

    // --- Tool button handlers ---

    document.getElementById('btn-pen').addEventListener('click', () => setActiveTool('pen'));
    document.getElementById('btn-rainbow').addEventListener('click', () => setActiveTool('rainbow'));
    document.getElementById('btn-eraser').addEventListener('click', () => setActiveTool('eraser'));
    document.getElementById('btn-text').addEventListener('click', () => setActiveTool('text'));
    document.getElementById('btn-select').addEventListener('click', () => setActiveTool('select'));
    document.getElementById('btn-move').addEventListener('click', () => setActiveTool('move'));

    // Layer actions (visible only while a layer is selected)
    document.getElementById('btn-front').addEventListener('click', () => reorderSelected('front'));
    document.getElementById('btn-back').addEventListener('click', () => reorderSelected('back'));
    document.getElementById('btn-delete-layer').addEventListener('click', () => deleteSelected());

    // Image insert — file picker, downscale, place centered in current view
    const imageInput = document.getElementById('image-input');
    document.getElementById('btn-image').addEventListener('click', () => imageInput.click());
    imageInput.addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      if (file) insertImageFile(file);
      imageInput.value = '';
    });

    function insertImageFile(file) {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const MAX = 1280;
          let w = img.naturalWidth, h = img.naturalHeight;
          if (w > MAX || h > MAX) {
            const r = Math.min(MAX / w, MAX / h);
            w = Math.round(w * r);
            h = Math.round(h * r);
          }
          const c = document.createElement('canvas');
          c.width = w; c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          // PNG keeps transparency; JPEG is much smaller for photos.
          const isPng = file.type === 'image/png';
          const src = c.toDataURL(isPng ? 'image/png' : 'image/jpeg', 0.85);
          // Place centered in the current viewport, sized to look ~natural at this zoom.
          const center = screenToWorld(canvas.width / 2, canvas.height / 2);
          const worldW = w / scale, worldH = h / scale;
          const item = { type: 'image', src, x: center.x - worldW / 2, y: center.y - worldH / 2, w: worldW, h: worldH, dx: 0, dy: 0 };
          saveStroke(item).then((saved) => {
            if (saved) {
              strokes.push({ id: saved.id, stroke_data: item, z_index: saved.z_index });
              recordAction({ type: 'add', id: saved.id, data: item });
              sortStrokes();
              redrawAll();
            }
          });
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    }

    document.getElementById('btn-emoji').addEventListener('click', () => {
      if (tool === 'emoji') {
        toggleEmojiPicker();
      } else {
        setActiveTool('emoji');
        showEmojiPicker();
      }
    });

    buildEmojiPicker();

    // --- Shapes tool wiring ---
    const shapesPopover = document.getElementById('shapes-popover');
    const btnShapes = document.getElementById('btn-shapes');
    const SHAPE_ICONS = {
      line: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="19" x2="19" y2="5"/></svg>',
      rect: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="1"/></svg>',
      circle: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/></svg>'
    };
    function hideShapesPopover() { shapesPopover.classList.add('hidden'); }
    function setShapeIcon() {
      btnShapes.innerHTML = SHAPE_ICONS[shapeType] || SHAPE_ICONS.line;
    }
    function markActiveShapeOption() {
      shapesPopover.querySelectorAll('.shape-opt').forEach((b) => {
        b.classList.toggle('active', b.dataset.shape === shapeType);
      });
    }
    setShapeIcon();
    markActiveShapeOption();

    btnShapes.addEventListener('click', (e) => {
      e.stopPropagation();
      if (tool === 'shape') {
        shapesPopover.classList.toggle('hidden');
      } else {
        setActiveTool('shape');
        shapesPopover.classList.remove('hidden');
      }
    });
    shapesPopover.addEventListener('click', (e) => e.stopPropagation());
    shapesPopover.querySelectorAll('.shape-opt').forEach((b) => {
      b.addEventListener('click', () => {
        shapeType = b.dataset.shape;
        setShapeIcon();
        markActiveShapeOption();
        setActiveTool('shape');
        hideShapesPopover();
      });
    });
    document.addEventListener('click', () => hideShapesPopover());

    // Color palette button + popover
    (function initColorPalette() {
      const COLOR_SWATCHES = [
        '#1c1917', '#6b7280', '#ffffff', '#ef4444',
        '#f97316', '#eab308', '#22c55e', '#3b82f6',
        '#8b5cf6', '#ec4899', '#14b8a6', '#92400e'
      ];

      const swatchWrap = document.getElementById('color-swatches');
      COLOR_SWATCHES.forEach((color) => {
        const sw = document.createElement('button');
        sw.type = 'button';
        sw.title = color;
        sw.style.backgroundColor = color;
        sw.className = 'w-7 h-7 rounded-md border border-zinc-300 dark:border-zinc-600 hover:scale-110 transition-transform';
        sw.addEventListener('click', () => {
          setStrokeColor(color);
          document.getElementById('color-popover').classList.add('hidden');
          if (tool === 'eraser' || tool === 'rainbow') setActiveTool('pen');
        });
        swatchWrap.appendChild(sw);
      });

      const btnColor = document.getElementById('btn-color');
      const colorPopover = document.getElementById('color-popover');

      function openColorPopover() {
        const rect = btnColor.getBoundingClientRect();
        colorPopover.style.top = (rect.bottom + 8) + 'px';
        const left = Math.min(rect.left, window.innerWidth - 184);
        colorPopover.style.left = Math.max(4, left) + 'px';
        colorPopover.classList.remove('hidden');
      }

      function closeColorPopover() {
        colorPopover.classList.add('hidden');
      }

      btnColor.addEventListener('click', () => {
        if (colorPopover.classList.contains('hidden')) {
          document.getElementById('bg-popover').classList.add('hidden');
          openColorPopover();
        } else {
          closeColorPopover();
        }
      });

      // Close on outside mousedown — fires before click, no stopPropagation needed
      document.addEventListener('mousedown', (e) => {
        if (!colorPopover.classList.contains('hidden') &&
            !colorPopover.contains(e.target) &&
            !btnColor.contains(e.target)) {
          closeColorPopover();
        }
      });

      document.getElementById('color-custom-stroke').addEventListener('input', (e) => {
        setStrokeColor(e.target.value);
        if (tool === 'eraser' || tool === 'rainbow') setActiveTool('pen');
      });
    })();

    const sizeSlider = document.getElementById('stroke-size');
    const sizeLabel = document.getElementById('size-label');
    sizeSlider.addEventListener('input', (e) => {
      strokeWidth = parseInt(e.target.value);
      sizeLabel.textContent = strokeWidth;
      updateBrushCursor();
    });

    document.getElementById('btn-undo').addEventListener('click', async () => {
      if (undoStack.length === 0) return;
      const a = undoStack.pop();
      await applyUndo(a);
      redoActions.push(a);
    });

    document.getElementById('btn-redo').addEventListener('click', async () => {
      if (redoActions.length === 0) return;
      const a = redoActions.pop();
      await applyRedo(a);
      undoStack.push(a);
    });

    function showConfirm(msg) {
      return new Promise((resolve) => {
        const modal = document.getElementById('confirm-modal');
        document.getElementById('confirm-msg').textContent = msg;
        modal.style.display = 'flex';
        modal.classList.remove('hidden');
        function cleanup(result) {
          modal.style.display = 'none';
          modal.classList.add('hidden');
          document.getElementById('confirm-ok').removeEventListener('click', onOk);
          document.getElementById('confirm-cancel').removeEventListener('click', onCancel);
          resolve(result);
        }
        function onOk() { cleanup(true); }
        function onCancel() { cleanup(false); }
        document.getElementById('confirm-ok').addEventListener('click', onOk);
        document.getElementById('confirm-cancel').addEventListener('click', onCancel);
      });
    }

    document.getElementById('btn-clear').addEventListener('click', async () => {
      if (strokes.length === 0) return;
      const confirmed = await showConfirm('Clear the entire shared whiteboard?');
      if (!confirmed) return;
      try {
        await fetch('/api/strokes', {
          method: 'DELETE',
          headers: { ...headers }
        });
      } catch (err) {
        console.error('Clear failed:', err);
      }
      strokes = [];
      undoStack = [];
      redoActions = [];
      deselectLayer();
      redrawAll();
    });

    document.getElementById('btn-theme').addEventListener('click', () => {
      const nowDark = !isDarkMode();
      if (nowDark) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
      localStorage.setItem('theme', nowDark ? 'dark' : 'light');
      syncThemeIcon();

      // Switch default stroke color when changing theme
      if (nowDark && strokeColor === DEFAULT_STROKE_LIGHT) {
        setStrokeColor(DEFAULT_STROKE_DARK);
      } else if (!nowDark && strokeColor === DEFAULT_STROKE_DARK) {
        setStrokeColor(DEFAULT_STROKE_LIGHT);
      }
      updateBrushCursor();
    });

    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
        e.preventDefault();
        if (e.shiftKey) {
          document.getElementById('btn-redo').click();
        } else {
          document.getElementById('btn-undo').click();
        }
      }
      // Ctrl+0 / Cmd+0 to reset zoom
      if ((e.ctrlKey || e.metaKey) && e.key === '0') {
        e.preventDefault();
        resetView();
      }
      // Delete / Backspace removes the selected layer
      if ((e.key === 'Delete' || e.key === 'Backspace') && selectedLayer) {
        e.preventDefault();
        deleteSelected();
        return;
      }
      // Spacebar hold for temporary move mode
      if (e.key === ' ' && !e.repeat && previousTool === null) {
        e.preventDefault();
        previousTool = tool;
        setActiveTool('move');
      }
    });

    document.addEventListener('keyup', (e) => {
      if (e.key === ' ' && previousTool !== null) {
        setActiveTool(previousTool);
        previousTool = null;
      }
    });

    // Home button and zoom indicator click handlers
    document.getElementById('btn-home').addEventListener('click', resetView);
    document.getElementById('zoom-indicator').addEventListener('click', resetView);

    // --- Background color ---
    // Strokes are drawn onto a transparent canvas (the eraser uses
    // destination-out), so the page background shows through. Changing the
    // body background recolors the drawing surface without touching strokes.
    // Stored locally — it's a personal view preference, not shared board state.
    const BG_KEY = 'whiteboard-bg';
    const BG_SWATCHES = [
      '#ffffff', '#f5f5f4', '#fef3c7', '#dcfce7',
      '#dbeafe', '#fae8ff', '#27272a', '#0f172a'
    ];

    function applyBackground(color) {
      document.body.style.backgroundColor = color;
      canvas.style.backgroundColor = color;
    }
