  <div id="layers-panel" class="hidden fixed top-20 right-3 bottom-4 w-64 max-w-[88vw] bg-white/95 dark:bg-zinc-800/95 border border-zinc-300 dark:border-zinc-700 rounded-2xl shadow-lg z-50 flex flex-col">
    <div class="flex items-center justify-between px-3 py-2 border-b border-zinc-200 dark:border-zinc-700">
      <span class="text-sm font-medium text-zinc-700 dark:text-zinc-200">Layers</span>
      <button id="btn-layers-close" class="w-7 h-7 rounded-lg flex items-center justify-center text-zinc-400 hover:text-zinc-700 dark:hover:text-zinc-200 hover:bg-zinc-100 dark:hover:bg-zinc-700" title="Close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div id="layers-list" class="flex-1 overflow-y-auto p-2 flex flex-col gap-1"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token') || '';
    const headers = token ? { 'x-usernode-token': token } : {};

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const DEFAULT_STROKE_LIGHT = '#1c1917';
    const DEFAULT_STROKE_DARK = '#e4e4e7';

    function isDarkMode() {
      return document.documentElement.classList.contains('dark');
    }

    let strokes = [];
    // Action-history undo/redo. Each entry: {type:'add'|'delete'|'move'|'reorder', id, ...}
    let undoStack = [];
    let redoActions = [];
    let currentStroke = null;
    // Decoded <img> cache keyed by image src / data URL.
    const imageCache = new Map();
    let tool = 'pen';

    // Selection / layer-manipulation state
    let selectedLayer = null;
    let isDraggingLayer = false;
    let dragStartWorld = { x: 0, y: 0 };
    let dragOrigDx = 0;
    let dragOrigDy = 0;
    let layerMoved = false;
    let isErasing = false;

    let strokeColor = isDarkMode() ? DEFAULT_STROKE_DARK : DEFAULT_STROKE_LIGHT;
    let strokeWidth = 3;
    let isDrawing = false;
    const brushCursor = document.getElementById('brush-cursor');

    // Shape tool state. When `tool === 'shape'`, `shapeType` selects which
    // primitive is drawn (line | rect | circle). A shape is defined by the
    // press point (shapeStart) and the current/release point (shapeEnd).
    let shapeType = 'line';
    let shapeStart = null;
    let shapeEnd = null;
    function isShapeTool() { return tool === 'shape'; }

    // Toolbar dragging state
    let toolbarPos = { x: 0, y: 0 };
    let isToolbarDragging = false;
    let toolbarDragStart = null;
    let toolbarDragOffset = { x: 0, y: 0 };
    let toolbarCollapseTimeout = null;

    function setStrokeColor(hex) {
      strokeColor = hex;
      document.getElementById('color-dot').style.backgroundColor = hex;
      if (/^#[0-9a-fA-F]{6}$/.test(hex)) {
        document.getElementById('color-custom-stroke').value = hex;
      }
    }

    // Sync color dot with initial theme
    setStrokeColor(strokeColor);

    // Update theme toggle icon visibility
    function syncThemeIcon() {
      const dark = isDarkMode();
      document.querySelector('.theme-icon-moon').style.display = dark ? 'none' : 'block';
      document.querySelector('.theme-icon-sun').style.display = dark ? 'block' : 'none';
    }
    syncThemeIcon();

    // Zoom/pan state (local only, not persisted)
    let scale = 1;
    let offsetX = 0;
    let offsetY = 0;
    const MIN_SCALE = 0.05;
    const MAX_SCALE = 20;
    let hasInitialResize = false;


    // Pan tracking
    let isPanning = false;
    let panStartX = 0;
    let panStartY = 0;
    let panStartOffsetX = 0;
    let panStartOffsetY = 0;

    // Pinch-to-zoom tracking (mobile)
    let isPinching = false;
    let lastPinchDist = 0;
    let lastPinchMidX = 0;
    let lastPinchMidY = 0;
    let lastPinchAngle = 0;

    // Rotation state (viewport only, not persisted)
    let rotation = 0;

    // Spacebar-hold for temporary move mode
    let previousTool = null;

    // Emoji tool
    const EMOJI_SIZE = 32;
    let selectedEmoji = '😀';
    const EMOJI_LIST = [
      '😀', '😂', '😍', '😎', '🤔', '😭', '😡', '🥳',
      '👍', '👎', '👏', '🙏', '💪', '🤝', '👀', '🔥',
      '❤️', '💔', '⭐', '✨', '🎉', '🎈', '💯', '✅',
      '❌', '❓', '💡', '🚀', '🐶', '🐱', '🌈', '☀️'
    ];

    // Text tool state
    let pendingTextX = 0;
    let pendingTextY = 0;
    // Font styling for newly placed text. Decoupled from the brush Size slider:
    // text size is governed solely by the text tool pop-up's size control.
    let textFontFamily = 'sans-serif';
    let textFontSize = 24;

    // Rainbow brush: hue advances this many degrees per recorded point.
    const RAINBOW_HUE_STEP = 8;
    function rainbowColor(index) {
      return 'hsl(' + (((index * RAINBOW_HUE_STEP) % 360 + 360) % 360) + ', 90%, 55%)';
    }

    // --- Handwriting optimisation tuning constants ---
    // Variable width maps drawing speed (and pressure where available) to a
    // multiplier of the base stroke width. Faster motion / lighter pressure =>
    // thinner; slower / heavier => thicker. World-space so it's zoom-invariant.
    const WIDTH_MIN_MULT = 0.5;   // thinnest (fast / light)
    const WIDTH_MAX_MULT = 1.6;   // thickest (slow / heavy)
    const SPEED_MAX = 2.0;        // world px per ms at which width hits the minimum
    const WIDTH_EMA_ALPHA = 0.5;  // exponential smoothing of per-point widths
    const MIN_POINT_DIST = 1.5;   // world px; points closer than this are thinned out

    // Pen pressure captured from PointerEvents (stylus only). 0 means "no real
    // signal" (mouse, or a pen that doesn't report pressure) and falls back to
    // the speed-based model. Touch pressure is read from TouchEvent force.
    let penPressure = 0;

    function speedToWidth(speed, baseWidth) {
      const t = Math.min(1, speed / SPEED_MAX);
      const mult = WIDTH_MAX_MULT + (WIDTH_MIN_MULT - WIDTH_MAX_MULT) * t;
      return baseWidth * mult;
    }

    function pressureToWidth(pressure, baseWidth) {
      const p = Math.max(0, Math.min(1, pressure));
      return baseWidth * (WIDTH_MIN_MULT + (WIDTH_MAX_MULT - WIDTH_MIN_MULT) * p);
    }

    // Read a real pressure signal for the current input event, or 0 if none.
    // Touch: TouchEvent.force (>0 on Apple Pencil / 3D-touch). Mouse path:
    // the last pen-pointer pressure stashed by the pointer listeners.
    function getPressure(e) {
      if (e.touches && e.touches.length > 0) {
        const f = e.touches[0].force;
        return (typeof f === 'number' && f > 0) ? f : 0;
      }
      return penPressure;
    }

    // Forward pass: bake a per-point width `w` from stored speed (point.t) and
    // pressure (point.pr), EMA-smoothed. Deterministic, so the live preview and
    // every client that re-renders the saved stroke agree.
    function computePointWidths(points, baseWidth) {
      let ema = baseWidth;
      for (let i = 0; i < points.length; i++) {
        const p = points[i];
        let target;
        if (typeof p.pr === 'number' && p.pr > 0) {
          target = pressureToWidth(p.pr, baseWidth);
        } else if (i > 0 && typeof p.t === 'number' && typeof points[i - 1].t === 'number') {
          const dt = Math.max(1, p.t - points[i - 1].t);
          const dx = p.x - points[i - 1].x;
          const dy = p.y - points[i - 1].y;
          const speed = Math.sqrt(dx * dx + dy * dy) / dt;
          target = speedToWidth(speed, baseWidth);
        } else {
          target = baseWidth;
        }
        ema = i === 0 ? target : (WIDTH_EMA_ALPHA * target + (1 - WIDTH_EMA_ALPHA) * ema);
        p.w = ema;
      }
    }

    // Quadratic-midpoint smoothing: builds a single smooth path through the
    // points (caller does beginPath/strokeStyle/lineWidth/stroke). Used for
    // uniform-width strokes (existing saved strokes, eraser).
    function buildSmoothPath(ctx, points) {
      const n = points.length;
      if (n < 2) return;
      ctx.moveTo(points[0].x, points[0].y);
      if (n === 2) {
        ctx.lineTo(points[1].x, points[1].y);
        return;
      }
      for (let i = 1; i < n - 1; i++) {
        const mx = (points[i].x + points[i + 1].x) / 2;
        const my = (points[i].y + points[i + 1].y) / 2;
        ctx.quadraticCurveTo(points[i].x, points[i].y, mx, my);
      }
      // Final segment runs through the last raw point.
      ctx.quadraticCurveTo(points[n - 2].x, points[n - 2].y, points[n - 1].x, points[n - 1].y);
    }

    // Smoothed render, segment-by-segment, so each piece can carry its own
    // width (point.w) and/or colour (getColor). Used for variable-width pen and
    // for the rainbow brush. Falls back to baseWidth where a point lacks `w`.
    function strokeSmoothSegments(ctx, points, getColor, baseWidth) {
      const n = points.length;
      if (n < 2) return;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      if (n === 2) {
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        ctx.lineTo(points[1].x, points[1].y);
        ctx.lineWidth = typeof points[1].w === 'number' ? points[1].w : baseWidth;
        if (getColor) ctx.strokeStyle = getColor(1);
        ctx.stroke();
        return;
      }
      let prevMidX = points[0].x, prevMidY = points[0].y;
      for (let i = 1; i < n; i++) {
        const p = points[i];
        let midX, midY;
        if (i < n - 1) {
          midX = (p.x + points[i + 1].x) / 2;
          midY = (p.y + points[i + 1].y) / 2;
        } else {
          midX = p.x;
          midY = p.y;
        }
        ctx.beginPath();
        ctx.moveTo(prevMidX, prevMidY);
        ctx.quadraticCurveTo(p.x, p.y, midX, midY);
        ctx.lineWidth = typeof p.w === 'number' ? p.w : baseWidth;
        if (getColor) ctx.strokeStyle = getColor(i);
        ctx.stroke();
        prevMidX = midX;
        prevMidY = midY;
      }
    }

    function hexToRgba(hex, alpha) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
    }

    function updateBrushCursor() {
      if (tool === 'text' || tool === 'shape' || tool === 'comment') {
        brushCursor.style.display = 'none';
        return;
      }
      const size = strokeWidth * scale;
      const displaySize = Math.max(size, 4);
      brushCursor.style.width = displaySize + 'px';
      brushCursor.style.height = displaySize + 'px';
      if (tool === 'eraser') {
        brushCursor.style.background = 'rgba(200, 200, 200, 0.5)';
        brushCursor.style.boxShadow = '0 0 0 1px rgba(160, 160, 160, 0.6)';
      } else if (tool === 'rainbow') {
        brushCursor.style.background = 'conic-gradient(from 0deg, #ef4444, #f59e0b, #eab308, #22c55e, #3b82f6, #8b5cf6, #ef4444)';
        brushCursor.style.boxShadow = 'none';
      } else {
        brushCursor.style.background = hexToRgba(strokeColor, 0.75);
        brushCursor.style.boxShadow = 'none';
      }
    }

    function moveBrushCursor(x, y) {
      brushCursor.style.left = x + 'px';
      brushCursor.style.top = y + 'px';
    }

    function showBrushCursor(show) {
      if (tool === 'move') {
        brushCursor.style.display = 'none';
        canvas.style.cursor = 'grab';
        return;
      }
      if (tool === 'text') {
        brushCursor.style.display = 'none';
        canvas.style.cursor = 'text';
        return;
      }
      if (tool === 'select') {
        brushCursor.style.display = 'none';
        canvas.style.cursor = 'default';
        return;
      }
      if (tool === 'shape' || tool === 'comment') {
        brushCursor.style.display = 'none';
        canvas.style.cursor = tool === 'comment' ? 'cell' : 'crosshair';
        return;
      }
      brushCursor.style.display = show ? 'block' : 'none';
      canvas.style.cursor = show ? 'none' : 'crosshair';
    }

    function resize() {
      const oldW = canvas.width;
      const oldH = canvas.height;
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      if (hasInitialResize && oldW && oldH) {
        offsetX += (canvas.width - oldW) / 2;
        offsetY += (canvas.height - oldH) / 2;
      }
      hasInitialResize = true;
      redrawAll();
      updateToolbarFades();
    }

    function updateToolbarFades() {
      const el = document.getElementById('toolbar-scroll');
      if (!el) return;
      const atLeft = el.scrollLeft <= 0;
      const atRight = el.scrollLeft + el.clientWidth >= el.scrollWidth - 2;
      document.getElementById('toolbar-scroll-left').style.opacity = atLeft ? '0' : '1';
      document.getElementById('toolbar-scroll-right').style.opacity = atRight ? '0' : '1';
    }

    // Stable z-order: explicit z_index, falling back to id for legacy rows.
    function sortStrokes() {
      strokes.sort((a, b) => {
        const za = a.z_index != null ? a.z_index : (a.id || 0);
        const zb = b.z_index != null ? b.z_index : (b.id || 0);
        if (za !== zb) return za - zb;
        return (a.id || 0) - (b.id || 0);
      });
    }

    function redrawAll(noSelection) {
      sortStrokes();
      const cos = Math.cos(rotation), sin = Math.sin(rotation);
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.setTransform(scale * cos, scale * sin, -scale * sin, scale * cos, offsetX, offsetY);
      for (const s of strokes) {
        const item = s.stroke_data || s;
        if (item.hidden) continue; // hidden layers are skipped (toggled in panel)
        drawItem(item);
      }
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      if (!noSelection) drawSelectionOverlay();
      renderLayerPanel();
      updatePins();
    }

    function drawItem(item) {
      // Per-layer translation (dx/dy) so moving never rewrites point arrays.
      const dx = item.dx || 0, dy = item.dy || 0;
      ctx.save();
      ctx.translate(dx, dy);
      if (item.type === 'emoji') {
        drawEmoji(item);
      } else if (item.type === 'image') {
        drawImageItem(item);
      } else if (item.type === 'shape') {
        drawShape(item);
      } else {
        drawStroke(item);
      }
      ctx.restore();
    }

    function getImage(src) {
      let img = imageCache.get(src);
      if (!img) {
        img = new Image();
        img.onload = () => redrawAll();
        img.src = src;
        imageCache.set(src, img);
      }
      return img;
    }

    function drawImageItem(item) {
      const img = getImage(item.src);
      if (img.complete && img.naturalWidth) {
        ctx.globalCompositeOperation = 'source-over';
        ctx.drawImage(img, item.x, item.y, item.w, item.h);
      }
    }

    // Render a shape primitive. `line` runs from (x0,y0) to (x1,y1); `rect`
    // and `circle` are bounded by the drag rectangle between those points
    // (circle is the ellipse inscribed in that box).
    function drawShape(s) {
      ctx.globalCompositeOperation = 'source-over';
      ctx.strokeStyle = s.color;
      ctx.lineWidth = s.width;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      if (s.shape === 'rect') {
        const x = Math.min(s.x0, s.x1);
        const y = Math.min(s.y0, s.y1);
        ctx.rect(x, y, Math.abs(s.x1 - s.x0), Math.abs(s.y1 - s.y0));
      } else if (s.shape === 'circle') {
        const cx = (s.x0 + s.x1) / 2;
        const cy = (s.y0 + s.y1) / 2;
        const rx = Math.abs(s.x1 - s.x0) / 2;
        const ry = Math.abs(s.y1 - s.y0) / 2;
        ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
      } else if (s.shape === 'arrow') {
        // Main shaft from start to end, plus an arrowhead at the end point.
        // Geometry is in world units so it scales with zoom like the shaft.
        ctx.moveTo(s.x0, s.y0);
        ctx.lineTo(s.x1, s.y1);
        const ang = Math.atan2(s.y1 - s.y0, s.x1 - s.x0);
        const headLen = Math.max(s.width * 3.5, 12);
        const headAng = Math.PI / 7; // ~25.7° half-angle
        ctx.moveTo(s.x1, s.y1);
        ctx.lineTo(s.x1 - headLen * Math.cos(ang - headAng), s.y1 - headLen * Math.sin(ang - headAng));
        ctx.moveTo(s.x1, s.y1);
        ctx.lineTo(s.x1 - headLen * Math.cos(ang + headAng), s.y1 - headLen * Math.sin(ang + headAng));
      } else {
        // line (default)
        ctx.moveTo(s.x0, s.y0);
        ctx.lineTo(s.x1, s.y1);
      }
      ctx.stroke();
    }

    function drawEmoji(item) {
      ctx.globalCompositeOperation = 'source-over';
      ctx.font = item.size + 'px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(item.emoji, item.x, item.y);
    }

    function drawStroke(s) {
      if (s.type === 'text') {
        ctx.font = s.fontSize + 'px ' + (s.fontFamily || 'sans-serif');
        ctx.fillStyle = s.color;
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillText(s.text, s.x, s.y);
        return;
      }
      if (s.type === 'image') {
        const cacheKey = s.dataUrl.slice(0, 64);
        let img = imageCache[cacheKey];
        if (!img) {
          img = new Image();
          img.onload = () => redrawAll();
          img.src = s.dataUrl;
          imageCache[cacheKey] = img;
        }
        if (img.complete && img.naturalWidth > 0) {
          ctx.globalCompositeOperation = 'source-over';
          ctx.drawImage(img, s.x, s.y, s.width, s.height);
        }
        return;
      }
      if (!s.points || s.points.length < 2) return;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      // Rainbow: smoothed, per-segment hue (and variable width when the points
      // carry `w`; older strokes without `w` fall back to the base width).
      if (s.rainbow && !s.eraser) {
        ctx.globalCompositeOperation = 'source-over';
        strokeSmoothSegments(ctx, s.points, rainbowColor, s.width);
        return;
      }

      // Variable-width pen: smoothed, per-segment width baked into the points.
      const hasVarWidth = !s.eraser && s.points.some((p) => typeof p.w === 'number');
      if (hasVarWidth) {
        ctx.globalCompositeOperation = 'source-over';
        ctx.strokeStyle = s.color;
        strokeSmoothSegments(ctx, s.points, null, s.width);
        return;
      }

      // Uniform width (eraser, and legacy strokes saved before variable width):
      // a single smooth quadratic path at the base width.
      ctx.lineWidth = s.width;
      ctx.beginPath();
      buildSmoothPath(ctx, s.points);
      ctx.strokeStyle = s.eraser ? '#ffffff' : s.color;
      if (s.eraser) {
        ctx.globalCompositeOperation = 'destination-out';
      } else {
        ctx.globalCompositeOperation = 'source-over';
      }
      ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
    }

    function screenToWorld(sx, sy) {
      const dx = sx - offsetX, dy = sy - offsetY;
      const cos = Math.cos(rotation), sin = Math.sin(rotation);
      return {
        x: (dx * cos + dy * sin) / scale,
        y: (-dx * sin + dy * cos) / scale
      };
    }

    function worldToScreen(x, y) {
      const cos = Math.cos(rotation), sin = Math.sin(rotation);
      return {
        x: scale * cos * x - scale * sin * y + offsetX,
        y: scale * sin * x + scale * cos * y + offsetY
      };
    }

    // World-space axis-aligned bounding box for a layer, including its dx/dy.
    function getLayerBBox(item) {
      const dx = item.dx || 0, dy = item.dy || 0;
      if (item.type === 'text') {
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.font = item.fontSize + 'px sans-serif';
        const w = ctx.measureText(item.text || '').width;
        ctx.restore();
        // fillText uses left/alphabetic baseline at (x, y).
        return { minX: item.x + dx, minY: item.y + dy - item.fontSize, maxX: item.x + dx + w, maxY: item.y + dy + item.fontSize * 0.3 };
      }
      if (item.type === 'emoji') {
        const h = item.size / 2;
        return { minX: item.x + dx - h, minY: item.y + dy - h, maxX: item.x + dx + h, maxY: item.y + dy + h };
      }
      if (item.type === 'image') {
        return { minX: item.x + dx, minY: item.y + dy, maxX: item.x + dx + item.w, maxY: item.y + dy + item.h };
      }
      if (item.type === 'shape') {
        // Bounding box spans both endpoints, padded for stroke width and any
        // arrowhead so the whole primitive is selectable.
        const pad = (item.width || 1) / 2 + (item.shape === 'arrow' ? Math.max(item.width * 3.5, 12) : 4);
        const minX = Math.min(item.x0, item.x1), maxX = Math.max(item.x0, item.x1);
        const minY = Math.min(item.y0, item.y1), maxY = Math.max(item.y0, item.y1);
        return { minX: minX + dx - pad, minY: minY + dy - pad, maxX: maxX + dx + pad, maxY: maxY + dy + pad };
      }
      if (item.points && item.points.length) {
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        for (const p of item.points) {
          if (p.x < minX) minX = p.x;
          if (p.y < minY) minY = p.y;
          if (p.x > maxX) maxX = p.x;
          if (p.y > maxY) maxY = p.y;
        }
        const r = (item.width || 1) / 2 + 4;
        return { minX: minX + dx - r, minY: minY + dy - r, maxX: maxX + dx + r, maxY: maxY + dy + r };
      }
      return null;
    }

    // Topmost layer (highest z) whose bbox contains the world point.
    function hitTest(wx, wy) {
      for (let i = strokes.length - 1; i >= 0; i--) {
        const item = strokes[i].stroke_data || strokes[i];
        if (item.hidden) continue; // hidden layers aren't selectable/eraseable
        const b = getLayerBBox(item);
        if (b && wx >= b.minX && wx <= b.maxX && wy >= b.minY && wy <= b.maxY) {
          return strokes[i];
        }
      }
      return null;
    }

    function drawSelectionOverlay() {
      if (!selectedLayer) return;
      const item = selectedLayer.stroke_data || selectedLayer;
      const b = getLayerBBox(item);
      if (!b) return;
      const corners = [
        worldToScreen(b.minX, b.minY),
        worldToScreen(b.maxX, b.minY),
        worldToScreen(b.maxX, b.maxY),
        worldToScreen(b.minX, b.maxY)
      ];
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalCompositeOperation = 'source-over';
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = '#7c3aed';
      ctx.setLineDash([6, 4]);
      ctx.beginPath();
      ctx.moveTo(corners[0].x, corners[0].y);
      for (let i = 1; i < 4; i++) ctx.lineTo(corners[i].x, corners[i].y);
      ctx.closePath();
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // --- Selection / layer manipulation ---

    function selectLayer(layer) {
      selectedLayer = layer;
      document.getElementById('layer-actions').classList.remove('hidden');
      document.getElementById('layer-actions').classList.add('flex');
      redrawAll();
      updateToolbarFades();
    }

    function deselectLayer() {
      if (!selectedLayer) return;
      selectedLayer = null;
      const la = document.getElementById('layer-actions');
      la.classList.add('hidden');
      la.classList.remove('flex');
      redrawAll();
      updateToolbarFades();
    }

    function findLayer(id) {
      return strokes.find(s => s.id === id);
    }

    async function patchLayer(id, body) {
      try {
        const res = await fetch('/api/strokes/' + id, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json', ...headers },
          body: JSON.stringify(body)
        });
        if (res.ok) return await res.json();
      } catch (err) {
        console.error('Update layer failed:', err);
      }
      return null;
    }

    function removeLayerById(id) {
      const idx = strokes.findIndex(s => s.id === id);
      if (idx !== -1) strokes.splice(idx, 1);
      if (selectedLayer && selectedLayer.id === id) deselectLayer();
      if (id) {
        fetch('/api/strokes/' + id, { method: 'DELETE', headers: { ...headers } })
          .catch(err => console.error('Delete failed:', err));
      }
      redrawAll();
    }

    function beginLayerDrag(pos) {
      const hit = hitTest(pos.x, pos.y);
      if (hit) {
        selectLayer(hit);
        isDraggingLayer = true;
        dragStartWorld = pos;
        const sd = hit.stroke_data || hit;
        dragOrigDx = sd.dx || 0;
        dragOrigDy = sd.dy || 0;
        layerMoved = false;
      } else {
        deselectLayer();
      }
    }

    function updateLayerDrag(pos) {
      if (!isDraggingLayer || !selectedLayer) return;
      const sd = selectedLayer.stroke_data || selectedLayer;
      sd.dx = dragOrigDx + (pos.x - dragStartWorld.x);
      sd.dy = dragOrigDy + (pos.y - dragStartWorld.y);
      layerMoved = true;
      redrawAll();
    }

    function endLayerDrag() {
      if (!isDraggingLayer) return;
      isDraggingLayer = false;
      if (layerMoved && selectedLayer) {
        const sd = selectedLayer.stroke_data || selectedLayer;
        recordAction({ type: 'move', id: selectedLayer.id, before: { dx: dragOrigDx, dy: dragOrigDy }, after: { dx: sd.dx || 0, dy: sd.dy || 0 } });
        patchLayer(selectedLayer.id, { stroke_data: sd });
      }
    }

    function eraseAt(pos) {
      const hit = hitTest(pos.x, pos.y);
      if (hit) {
        recordAction({ type: 'delete', id: hit.id, data: hit.stroke_data || hit, z_index: hit.z_index });
        removeLayerById(hit.id);
      }
    }

    function deleteSelected() {
      if (!selectedLayer) return;
      const layer = selectedLayer;
      recordAction({ type: 'delete', id: layer.id, data: layer.stroke_data || layer, z_index: layer.z_index });
      removeLayerById(layer.id);
    }

    async function reorderSelected(dir) {
      if (!selectedLayer) return;
      const before = selectedLayer.z_index;
      const res = await patchLayer(selectedLayer.id, { z_index: dir });
      if (res) {
        selectedLayer.z_index = res.z_index;
        recordAction({ type: 'reorder', id: selectedLayer.id, before, after: res.z_index });
        sortStrokes();
        redrawAll();
      }
    }

    // Generalized delete (used by the layer panel; deleteSelected handles the
    // currently-selected layer).
    function deleteLayerRow(layer) {
      if (!layer) return;
      recordAction({ type: 'delete', id: layer.id, data: layer.stroke_data || layer, z_index: layer.z_index });
      removeLayerById(layer.id);
    }

    // Move a layer one step in z-order by swapping z_index values with its
    // neighbour. dir 'up' = toward the front (higher z), 'down' = toward back.
    async function moveLayerStep(layer, dir) {
      sortStrokes(); // ascending by z_index
      const idx = strokes.findIndex(s => s.id === layer.id);
      if (idx === -1) return;
      const neighbourIdx = dir === 'up' ? idx + 1 : idx - 1;
      if (neighbourIdx < 0 || neighbourIdx >= strokes.length) return;
      const a = strokes[idx], b = strokes[neighbourIdx];
      const za = (a.z_index != null ? a.z_index : a.id);
      const zb = (b.z_index != null ? b.z_index : b.id);
      const before = a.z_index;
      const r1 = await patchLayer(a.id, { z_index: zb });
      const r2 = await patchLayer(b.id, { z_index: za });
      a.z_index = r1 ? r1.z_index : zb;
      b.z_index = r2 ? r2.z_index : za;
      recordAction({ type: 'reorder', id: a.id, before, after: a.z_index });
      sortStrokes();
      redrawAll();
    }

    // Toggle a layer's shared visibility. Persisted in stroke_data.hidden so it
    // syncs to other clients via the PATCH broadcast.
    async function toggleLayerHidden(layer) {
      const sd = layer.stroke_data || layer;
      sd.hidden = !sd.hidden;
      if (sd.hidden && selectedLayer && selectedLayer.id === layer.id) deselectLayer();
      await patchLayer(layer.id, { stroke_data: sd });
      redrawAll();
    }

    // --- Layers panel ---

    function layerLabel(item) {
      if (!item) return 'Layer';
      switch (item.type) {
        case 'text': {
          const t = (item.text || '').trim();
          return 'Text: ' + (t.length > 20 ? t.slice(0, 20) + '…' : t);
        }
        case 'emoji': return 'Emoji ' + (item.emoji || '');
        case 'image': return 'Image';
        case 'shape': {
          const names = { rect: 'Rectangle', circle: 'Circle', arrow: 'Arrow', line: 'Line' };
          return names[item.shape] || 'Shape';
        }
        default:
          if (item.eraser) return 'Eraser mask';
          if (item.rainbow) return 'Rainbow';
          return 'Pen';
      }
    }

    function makePanelBtn(svg, title, onClick, extraClass) {
      const b = document.createElement('button');
      b.type = 'button';
      b.title = title;
      b.className = 'w-7 h-7 rounded-md flex items-center justify-center text-zinc-500 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-zinc-700 ' + (extraClass || '');
      b.innerHTML = svg;
      b.addEventListener('click', (e) => { e.stopPropagation(); onClick(); });
      return b;
    }

    const PANEL_ICONS = {
      eye: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>',
      eyeOff: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>',
      up: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>',
      down: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>',
      front: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 11 12 6 7 11"/><polyline points="17 18 12 13 7 18"/></svg>',
      back: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="7 13 12 18 17 13"/><polyline points="7 6 12 11 17 6"/></svg>',
      trash: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>'
    };

    function renderLayerPanel() {
      const panel = document.getElementById('layers-panel');
      if (!panel || panel.classList.contains('hidden')) return;
      const list = document.getElementById('layers-list');
      list.innerHTML = '';
      if (!strokes.length) {
        const empty = document.createElement('p');
        empty.className = 'text-xs text-zinc-400 dark:text-zinc-500 text-center py-6';
        empty.textContent = 'No layers yet — draw something.';
        list.appendChild(empty);
        return;
      }
      // Topmost first: walk the z-sorted (ascending) array in reverse.
      sortStrokes();
      for (let i = strokes.length - 1; i >= 0; i--) {
        const layer = strokes[i];
        const item = layer.stroke_data || layer;
        const isSel = selectedLayer && selectedLayer.id === layer.id;

        const row = document.createElement('div');
        row.className = 'rounded-lg px-2 py-1.5 cursor-pointer border ' +
          (isSel
            ? 'border-violet-500 bg-violet-50 dark:bg-violet-500/10'
            : 'border-transparent hover:bg-zinc-100 dark:hover:bg-zinc-700/60');
        row.addEventListener('click', () => {
          if (item.hidden) return; // hidden layers can't be selected on canvas
          if (selectedLayer && selectedLayer.id === layer.id) { deselectLayer(); }
          else { selectLayer(layer); }
        });

        const top = document.createElement('div');
        top.className = 'flex items-center justify-between gap-2';
        const label = document.createElement('span');
        label.className = 'text-xs font-medium text-zinc-700 dark:text-zinc-200 truncate' + (item.hidden ? ' opacity-50' : '');
        label.textContent = layerLabel(item);
        const owner = document.createElement('span');
        owner.className = 'text-[10px] text-zinc-400 dark:text-zinc-500 truncate flex-shrink-0 max-w-[5.5rem]';
        owner.textContent = layer.username || '';
        top.appendChild(label);
        top.appendChild(owner);

        const actions = document.createElement('div');
        actions.className = 'flex items-center gap-0.5 mt-1';
        actions.appendChild(makePanelBtn(item.hidden ? PANEL_ICONS.eyeOff : PANEL_ICONS.eye,
          item.hidden ? 'Show' : 'Hide', () => toggleLayerHidden(layer)));
        actions.appendChild(makePanelBtn(PANEL_ICONS.up, 'Move up', () => moveLayerStep(layer, 'up')));
        actions.appendChild(makePanelBtn(PANEL_ICONS.down, 'Move down', () => moveLayerStep(layer, 'down')));
        actions.appendChild(makePanelBtn(PANEL_ICONS.front, 'Bring to front', async () => {
          const before = layer.z_index;
          const res = await patchLayer(layer.id, { z_index: 'front' });
          if (res) { layer.z_index = res.z_index; recordAction({ type: 'reorder', id: layer.id, before, after: res.z_index }); sortStrokes(); redrawAll(); }
        }));
        actions.appendChild(makePanelBtn(PANEL_ICONS.back, 'Send to back', async () => {
          const before = layer.z_index;
          const res = await patchLayer(layer.id, { z_index: 'back' });
          if (res) { layer.z_index = res.z_index; recordAction({ type: 'reorder', id: layer.id, before, after: res.z_index }); sortStrokes(); redrawAll(); }
        }));
        actions.appendChild(makePanelBtn(PANEL_ICONS.trash, 'Delete layer', () => deleteLayerRow(layer), 'text-red-500 ml-auto'));

        row.appendChild(top);
        row.appendChild(actions);
        list.appendChild(row);
      }
    }

    function updateUndoRedoButtons() {
      const u = document.getElementById('btn-undo');
      const r = document.getElementById('btn-redo');
      if (u) u.style.opacity = undoStack.length ? '1' : '0.35';
      if (r) r.style.opacity = redoActions.length ? '1' : '0.35';
    }

    // --- Action-history undo/redo ---

    function recordAction(a) {
      undoStack.push(a);
      redoActions = [];
      updateUndoRedoButtons();
    }

    async function recreateLayer(action) {
      const saved = await saveStroke(action.data);
      if (saved) {
        strokes.push({ id: saved.id, stroke_data: action.data, z_index: saved.z_index });
        action.id = saved.id; // subsequent redo/undo targets the new row
        sortStrokes();
        redrawAll();
      }
    }

    async function applyUndo(a) {
      if (a.type === 'add') {
        removeLayerById(a.id);
      } else if (a.type === 'delete') {
        await recreateLayer(a);
      } else if (a.type === 'move') {
        const l = findLayer(a.id);
        if (l) {
          const sd = l.stroke_data || l;
          sd.dx = a.before.dx; sd.dy = a.before.dy;
          patchLayer(a.id, { stroke_data: sd });
          redrawAll();
        }
      } else if (a.type === 'reorder') {
        const l = findLayer(a.id);
        if (l) {
          const res = await patchLayer(a.id, { z_index: a.before });
          if (res) l.z_index = res.z_index;
          sortStrokes();
          redrawAll();
        }
      }
    }

    async function applyRedo(a) {
      if (a.type === 'add') {
        await recreateLayer(a);
      } else if (a.type === 'delete') {
        removeLayerById(a.id);
      } else if (a.type === 'move') {
        const l = findLayer(a.id);
        if (l) {
          const sd = l.stroke_data || l;
          sd.dx = a.after.dx; sd.dy = a.after.dy;
          patchLayer(a.id, { stroke_data: sd });
          redrawAll();
        }
      } else if (a.type === 'reorder') {
        const l = findLayer(a.id);
        if (l) {
          const res = await patchLayer(a.id, { z_index: a.after });
          if (res) l.z_index = res.z_index;
          sortStrokes();
          redrawAll();
        }
      }
    }


    function getPos(e) {
      let sx, sy;
      if (e.touches && e.touches.length > 0) {
        sx = e.touches[0].clientX;
        sy = e.touches[0].clientY;
      } else {
        sx = e.clientX;
        sy = e.clientY;
      }
      return screenToWorld(sx, sy);
    }

    function zoomAtPoint(cx, cy, newScale) {
      newScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, newScale));
      const ratio = newScale / scale;
      offsetX = cx - (cx - offsetX) * ratio;
      offsetY = cy - (cy - offsetY) * ratio;
      scale = newScale;
      updateBrushCursor();
      updateZoomIndicator();
      redrawAll();
    }

    function updateZoomIndicator() {
      document.getElementById('zoom-indicator').textContent = Math.round(scale * 100) + '%';
    }

    function resetView() {
      if (scale === 1 && offsetX === 0 && offsetY === 0 && rotation === 0) {
        showStatus('View already at default');
        return;
      }
      scale = 1;
      offsetX = 0;
      offsetY = 0;
      rotation = 0;
      updateBrushCursor();
      updateZoomIndicator();
      redrawAll();
      showStatus('View reset');
    }

    function setActiveTool(newTool) {
      if (tool === 'text' && newTool !== 'text') {
        const textInput = document.getElementById('text-input');
        if (textInput.style.display !== 'none') commitText();
      }
      // Leaving the select tool clears any active selection.
      if (tool === 'select' && newTool !== 'select') deselectLayer();
      tool = newTool;
      document.getElementById('btn-pen').classList.toggle('active', newTool === 'pen');
      document.getElementById('btn-rainbow').classList.toggle('active', newTool === 'rainbow');
      document.getElementById('btn-eraser').classList.toggle('active', newTool === 'eraser');
      document.getElementById('btn-text').classList.toggle('active', newTool === 'text');
      document.getElementById('btn-select').classList.toggle('active', newTool === 'select');
      document.getElementById('btn-move').classList.toggle('active', newTool === 'move');
      document.getElementById('btn-emoji').classList.toggle('active', newTool === 'emoji');
      document.getElementById('btn-shapes').classList.toggle('active', newTool === 'shape');
      document.getElementById('btn-comment').classList.toggle('active', newTool === 'comment');
      if (newTool !== 'emoji') hideEmojiPicker();
      if (newTool !== 'shape') hideShapesPopover();
      if (newTool !== 'comment') hideComposer();
      if (newTool !== 'text') hideTextPopover(); else showTextPopover();
      if (newTool === 'move') {
        canvas.style.cursor = 'grab';
        brushCursor.style.display = 'none';
        canvas.classList.add('panning');
      } else if (newTool === 'select') {
        canvas.style.cursor = 'default';
        brushCursor.style.display = 'none';
        canvas.classList.remove('panning');
      } else if (newTool === 'emoji') {
        canvas.classList.remove('panning');
        brushCursor.style.display = 'none';
        canvas.style.cursor = 'crosshair';
      } else if (newTool === 'text') {
        canvas.style.cursor = 'text';
        brushCursor.style.display = 'none';
        canvas.classList.remove('panning');
      } else if (newTool === 'shape') {
        canvas.classList.remove('panning');
        brushCursor.style.display = 'none';
        canvas.style.cursor = 'crosshair';
      } else if (newTool === 'comment') {
        canvas.classList.remove('panning');
        brushCursor.style.display = 'none';
        canvas.style.cursor = 'cell';
      } else {
        canvas.classList.remove('panning');
        updateBrushCursor();
      }
    }

    const emojiPicker = document.getElementById('emoji-picker');
    function buildEmojiPicker() {
      const grid = emojiPicker.querySelector('.grid');
      for (const emoji of EMOJI_LIST) {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = emoji;
        b.className = 'w-9 h-9 rounded-lg flex items-center justify-center text-xl hover:bg-zinc-100';
        b.addEventListener('click', () => {
          selectedEmoji = emoji;
          hideEmojiPicker();
        });
        grid.appendChild(b);
      }
    }
    function showEmojiPicker() { emojiPicker.classList.remove('hidden'); }
    function hideEmojiPicker() { emojiPicker.classList.add('hidden'); }
    function toggleEmojiPicker() { emojiPicker.classList.toggle('hidden'); }

    function placeEmoji(e) {
      const pos = getPos(e);
      const item = { type: 'emoji', emoji: selectedEmoji, x: pos.x, y: pos.y, size: EMOJI_SIZE, dx: 0, dy: 0 };
      saveStroke(item).then((saved) => {
        if (saved) {
          strokes.push({ id: saved.id, stroke_data: item, z_index: saved.z_index });
          recordAction({ type: 'add', id: saved.id, data: item });
          sortStrokes();
          redrawAll();
        }
      });
      setActiveTool('pen');
    }

    function getPinchDist(t1, t2) {
      const dx = t1.clientX - t2.clientX;
      const dy = t1.clientY - t2.clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function getPinchMid(t1, t2) {
      return { x: (t1.clientX + t2.clientX) / 2, y: (t1.clientY + t2.clientY) / 2 };
    }

    function getPinchAngle(t1, t2) {
      return Math.atan2(t2.clientY - t1.clientY, t2.clientX - t1.clientX);
    }

    function startDraw(e) {
      if (e.target.closest('.toolbar')) return;
      // Freehand tools and the shape tool draw here. Eraser deletes whole
      // layers, select moves them, and move/text/emoji/image are handled
      // elsewhere.
      if (tool !== 'pen' && tool !== 'rainbow' && !isShapeTool()) return;
      e.preventDefault();
      isDrawing = true;
      const pos = getPos(e);
      if (isShapeTool()) {
        shapeStart = pos;
        shapeEnd = pos;
        currentStroke = null;
        return;
      }
      pos.t = performance.now();
      const pr0 = getPressure(e);
      if (pr0 > 0) pos.pr = pr0;
      currentStroke = {
        points: [pos],
        color: strokeColor,
        width: strokeWidth,
        eraser: false,
        rainbow: tool === 'rainbow',
        emaWidth: null
      };
    }

    // Re-render the live shape preview on top of the committed strokes while
    // the user drags. redrawAll() has already cleared and repainted the board.
    function drawShapePreview() {
      if (!shapeStart || !shapeEnd) return;
      const cos = Math.cos(rotation), sin = Math.sin(rotation);
      ctx.setTransform(scale * cos, scale * sin, -scale * sin, scale * cos, offsetX, offsetY);
      drawShape({
        shape: shapeType,
        x0: shapeStart.x, y0: shapeStart.y,
        x1: shapeEnd.x, y1: shapeEnd.y,
        color: strokeColor,
        width: strokeWidth
      });
      ctx.setTransform(1, 0, 0, 1, 0, 0);
    }

    function moveDraw(e) {
      if (!isDrawing) return;
      if (isShapeTool()) {
        if (!shapeStart) return;
        e.preventDefault();
        shapeEnd = getPos(e);
        redrawAll();
        drawShapePreview();
        return;
      }
      if (!currentStroke) return;
      e.preventDefault();
      const pos = getPos(e);
      const pts = currentStroke.points;
      const last = pts[pts.length - 1];

      // Minimum-distance thinning (world space): drop points too close to the
      // previous one so high-frequency move events don't bloat the stroke.
      const dx = pos.x - last.x;
      const dy = pos.y - last.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < MIN_POINT_DIST) return;

      const now = performance.now();
      pos.t = now;
      const pr = getPressure(e);
      if (pr > 0) pos.pr = pr;

      // Provisional per-point width for the live preview — mirrors the
      // commit-time bake (computePointWidths) so the preview matches the
      // committed render. Eraser stays uniform width.
      if (!currentStroke.eraser) {
        let target;
        if (pr > 0) {
          target = pressureToWidth(pr, currentStroke.width);
        } else {
          const dt = Math.max(1, now - (last.t || now));
          target = speedToWidth(dist / dt, currentStroke.width);
        }
        currentStroke.emaWidth = currentStroke.emaWidth == null
          ? target
          : (WIDTH_EMA_ALPHA * target + (1 - WIDTH_EMA_ALPHA) * currentStroke.emaWidth);
        pos.w = currentStroke.emaWidth;
      }

      pts.push(pos);

      // Draw the newly-added smoothed segment incrementally. The quadratic
      // midpoint method is causal, so the segment up to the previous midpoint
      // is final; endDraw's redrawAll repaints the fully-smoothed stroke.
      const cos = Math.cos(rotation), sin = Math.sin(rotation);
      ctx.setTransform(scale * cos, scale * sin, -scale * sin, scale * cos, offsetX, offsetY);
      const n = pts.length;
      ctx.beginPath();
      if (n === 2) {
        ctx.moveTo(pts[0].x, pts[0].y);
        ctx.lineTo(pts[1].x, pts[1].y);
      } else {
        const a = pts[n - 3], b = pts[n - 2], c = pts[n - 1];
        ctx.moveTo((a.x + b.x) / 2, (a.y + b.y) / 2);
        ctx.quadraticCurveTo(b.x, b.y, (b.x + c.x) / 2, (b.y + c.y) / 2);
      }
      if (currentStroke.rainbow && !currentStroke.eraser) {
        ctx.strokeStyle = rainbowColor(n - 1);
      } else {
        ctx.strokeStyle = currentStroke.eraser ? '#ffffff' : currentStroke.color;
      }
      ctx.lineWidth = currentStroke.eraser ? currentStroke.width : (pos.w || currentStroke.width);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      if (currentStroke.eraser) {
        ctx.globalCompositeOperation = 'destination-out';
      } else {
        ctx.globalCompositeOperation = 'source-over';
      }
      ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
      ctx.setTransform(1, 0, 0, 1, 0, 0);
    }

    async function endDraw(e) {
      if (!isDrawing) return;
      if (isShapeTool()) {
        e.preventDefault();
        isDrawing = false;
        if (shapeStart && shapeEnd) {
          const dx = shapeEnd.x - shapeStart.x;
          const dy = shapeEnd.y - shapeStart.y;
          // Ignore a click with no drag (zero-size shape).
          if (Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5) {
            const strokeData = {
              type: 'shape',
              shape: shapeType,
              x0: shapeStart.x, y0: shapeStart.y,
              x1: shapeEnd.x, y1: shapeEnd.y,
              color: strokeColor,
              width: strokeWidth,
              dx: 0,
              dy: 0
            };
            const saved = await saveStroke(strokeData);
            if (saved) {
              strokes.push({ id: saved.id, stroke_data: strokeData, z_index: saved.z_index });
              recordAction({ type: 'add', id: saved.id, data: strokeData });
            }
          }
        }
        shapeStart = null;
        shapeEnd = null;
        redrawAll();
        return;
      }
      if (!currentStroke) return;
      e.preventDefault();
      if (currentStroke.points.length >= 2) {
        // Bake the final per-point width from the captured speed/pressure, then
        // persist only {x, y, w} (eraser stays uniform: {x, y}). Computing here
        // keeps stored strokes self-describing — other clients and re-renders
        // don't need the speed/pressure model.
        let points;
        if (currentStroke.eraser) {
          points = currentStroke.points.map((p) => ({ x: p.x, y: p.y }));
        } else {
          computePointWidths(currentStroke.points, currentStroke.width);
          points = currentStroke.points.map((p) => ({
            x: p.x,
            y: p.y,
            w: Math.round(p.w * 10) / 10
          }));
        }
        const strokeData = {
          points: points,
          color: currentStroke.color,
          width: currentStroke.width,
          eraser: currentStroke.eraser,
          rainbow: currentStroke.rainbow,
          dx: 0,
          dy: 0
        };
        const saved = await saveStroke(strokeData);
        if (saved) {
          strokes.push({ id: saved.id, stroke_data: strokeData, z_index: saved.z_index });
          recordAction({ type: 'add', id: saved.id, data: strokeData });
        }
      }
      currentStroke = null;
      isDrawing = false;
      redrawAll();
    }

    // --- Mouse event listeners ---

    // Stylus pressure capture. Pointer events fire alongside mouse events; we
    // only stash pressure for actual pens so the mouse path keeps using the
    // speed model (getPressure returns this for non-touch input).
    function trackPenPressure(e) {
      penPressure = (e.pointerType === 'pen' && e.pressure > 0) ? e.pressure : 0;
    }
    canvas.addEventListener('pointerdown', trackPenPressure);
    canvas.addEventListener('pointermove', trackPenPressure);

    canvas.addEventListener('mousedown', (e) => {
      if (e.target.closest('.toolbar')) return;
      // Middle mouse button always pans
      if (e.button === 1) {
        e.preventDefault();
        isPanning = true;
        panStartX = e.clientX;
        panStartY = e.clientY;
        panStartOffsetX = offsetX;
        panStartOffsetY = offsetY;
        canvas.style.cursor = 'grabbing';
        return;
      }
      // Left click in move mode: pan
      if (tool === 'move' && e.button === 0) {
        e.preventDefault();
        isPanning = true;
        panStartX = e.clientX;
        panStartY = e.clientY;
        panStartOffsetX = offsetX;
        panStartOffsetY = offsetY;
        canvas.style.cursor = 'grabbing';
        return;
      }
      // Emoji tool: don't start a stroke on mousedown; placement happens on pointerup
      if (tool === 'emoji') {
        return;
      }
      // Left click in text mode: place text input
      if (tool === 'text' && e.button === 0) {
        e.preventDefault();
        const textInput = document.getElementById('text-input');
        if (textInput.style.display !== 'none') {
          commitText();
        }
        openTextInput(e.clientX, e.clientY);
        return;
      }
      // Left click in comment mode: open composer for a new thread
      if (tool === 'comment' && e.button === 0) {
        e.preventDefault();
        openComposer(e.clientX, e.clientY);
        return;
      }
      // Select tool: pick / start dragging a layer
      if (tool === 'select' && e.button === 0) {
        e.preventDefault();
        beginLayerDrag(getPos(e));
        return;
      }
      // Object eraser: delete whole layers under the pointer
      if (tool === 'eraser' && e.button === 0) {
        e.preventDefault();
        isErasing = true;
        eraseAt(getPos(e));
        return;
      }
      startDraw(e);
    });

    // Emoji tool: place on pointerup so it works for both mouse clicks and
    // touch taps. Synthetic `click` events are unreliable on mobile when
    // touch-action is none, so we use the unified pointer event instead.
    canvas.addEventListener('pointerup', (e) => {
      if (tool !== 'emoji') return;
      if (e.target.closest('.toolbar') || e.target.closest('#emoji-picker')) return;
      placeEmoji(e);
    });

    canvas.addEventListener('mousemove', (e) => {
      if (tool !== 'move' && tool !== 'select') {
        moveBrushCursor(e.clientX, e.clientY);
      }
      if (isPanning) {
        offsetX = panStartOffsetX + (e.clientX - panStartX);
        offsetY = panStartOffsetY + (e.clientY - panStartY);
        redrawAll();
        return;
      }
      if (isDraggingLayer) {
        updateLayerDrag(getPos(e));
        return;
      }
      if (isErasing) {
        eraseAt(getPos(e));
        return;
      }
      moveDraw(e);
    });

    canvas.addEventListener('mouseup', (e) => {
      if (isPanning) {
        isPanning = false;
        canvas.style.cursor = tool === 'move' ? 'grab' : 'crosshair';
        return;
      }
      if (isDraggingLayer) { endLayerDrag(); return; }
      if (isErasing) { isErasing = false; return; }
      endDraw(e);
    });

    canvas.addEventListener('mouseleave', (e) => {
      brushCursor.style.display = 'none';
      if (isPanning) {
        isPanning = false;
        canvas.style.cursor = tool === 'move' ? 'grab' : 'crosshair';
        return;
      }
      if (isDraggingLayer) { endLayerDrag(); return; }
      if (isErasing) { isErasing = false; return; }
      endDraw(e);
    });

    canvas.addEventListener('mouseenter', (e) => {
      if (tool === 'move') {
        canvas.style.cursor = 'grab';
      } else {
        updateBrushCursor();
        showBrushCursor(true);
        moveBrushCursor(e.clientX, e.clientY);
      }
    });

    // Wheel: pinch-to-zoom (ctrlKey) or trackpad pan (no ctrlKey)
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (e.ctrlKey) {
        // Pinch-to-zoom gesture (trackpad) or Ctrl+scroll (mouse).
        // Normalize deltaY across deltaMode and input device:
        //   deltaMode=1 (line, Firefox mouse wheel): deltaY≈3 → convert to pixels
        //   deltaMode=0, |deltaY|>50 (discrete mouse wheel click): use fixed step
        //   deltaMode=0, |deltaY|≤50 (trackpad): continuous formula works well
        let dy = e.deltaY;
        let newScale;
        if (e.deltaMode === 1) {
          // Line mode — Firefox mouse wheel: each notch is deltaY≈3 lines
          newScale = scale * Math.pow(1.15, -Math.sign(dy));
        } else if (Math.abs(dy) > 50) {
          // Pixel mode, large delta — discrete mouse wheel click
          newScale = scale * Math.pow(1.15, -Math.sign(dy));
        } else {
          // Pixel mode, small delta — trackpad continuous gesture
          newScale = scale * Math.pow(1.01, -dy);
        }
        zoomAtPoint(e.clientX, e.clientY, newScale);
      } else {
        // Two-finger scroll / trackpad pan / regular mouse wheel
        offsetX -= e.deltaX;
        offsetY -= e.deltaY;
        redrawAll();
      }
    }, { passive: false });

    // Double-click to reset view when in move mode
    canvas.addEventListener('dblclick', (e) => {
      if (tool === 'move') {
        e.preventDefault();
        resetView();
      }
    });

    // --- Touch event listeners ---

    canvas.addEventListener('touchstart', (e) => {
      if (e.target.closest('.toolbar')) return;

      // Two-finger gesture: enter pinch-to-zoom regardless of active tool
      if (e.touches.length === 2) {
        e.preventDefault();
        isPanning = false;
        isPinching = true;
        endDraw(e);
        showBrushCursor(false);
        lastPinchDist = getPinchDist(e.touches[0], e.touches[1]);
        lastPinchAngle = getPinchAngle(e.touches[0], e.touches[1]);
        const mid = getPinchMid(e.touches[0], e.touches[1]);
        lastPinchMidX = mid.x;
        lastPinchMidY = mid.y;
        return;
      }

      if (tool === 'text') {
        e.preventDefault();
        if (e.touches.length === 1) {
          const textInput = document.getElementById('text-input');
          if (textInput.style.display !== 'none') {
            commitText();
          }
          openTextInput(e.touches[0].clientX, e.touches[0].clientY);
        }
        return;
      }

      if (tool === 'comment') {
        e.preventDefault();
        if (e.touches.length === 1) {
          openComposer(e.touches[0].clientX, e.touches[0].clientY);
        }
        return;
      }

      if (tool === 'move') {
        e.preventDefault();
        if (e.touches.length === 1) {
          isPanning = true;
          panStartX = e.touches[0].clientX;
          panStartY = e.touches[0].clientY;
          panStartOffsetX = offsetX;
          panStartOffsetY = offsetY;
        }
        return;
      }

      // Emoji tool: don't start a stroke; the pointerup handler places the emoji
      if (tool === 'emoji') {
        return;
      }

      // Select tool: pick / start dragging a layer
      if (tool === 'select') {
        e.preventDefault();
        if (e.touches.length === 1) beginLayerDrag(getPos(e));
        return;
      }

      // Object eraser: delete whole layers under the touch
      if (tool === 'eraser') {
        e.preventDefault();
        if (e.touches.length === 1) { isErasing = true; eraseAt(getPos(e)); }
        return;
      }

      // Drawing mode (single touch)
      if (e.touches.length === 1) {
        updateBrushCursor();
        showBrushCursor(true);
        moveBrushCursor(e.touches[0].clientX, e.touches[0].clientY);
        startDraw(e);
      }
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
      // Pinch-to-zoom: runs for all tool modes
      if (isPinching) {
        e.preventDefault();
        if (e.touches.length === 2) {
          const dist = getPinchDist(e.touches[0], e.touches[1]);
          const mid = getPinchMid(e.touches[0], e.touches[1]);
          const angle = getPinchAngle(e.touches[0], e.touches[1]);

          // Compute world point under the old midpoint (anchor stays fixed)
          const anchor = screenToWorld(lastPinchMidX, lastPinchMidY);

          // Apply scale and rotation deltas
          scale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, scale * (dist / lastPinchDist)));
          rotation += angle - lastPinchAngle;

          // Recompute offsets so anchor maps back to new midpoint
          const cos = Math.cos(rotation), sin = Math.sin(rotation);
          offsetX = mid.x - scale * (cos * anchor.x - sin * anchor.y);
          offsetY = mid.y - scale * (sin * anchor.x + cos * anchor.y);

          lastPinchDist = dist;
          lastPinchMidX = mid.x;
          lastPinchMidY = mid.y;
          lastPinchAngle = angle;

          updateZoomIndicator();
          updateBrushCursor();
          redrawAll();
        }
        return;
      }

      if (tool === 'move') {
        e.preventDefault();
        if (e.touches.length === 1 && isPanning) {
          offsetX = panStartOffsetX + (e.touches[0].clientX - panStartX);
          offsetY = panStartOffsetY + (e.touches[0].clientY - panStartY);
          redrawAll();
        }
        return;
      }

      if (tool === 'select') {
        e.preventDefault();
        if (isDraggingLayer && e.touches.length === 1) updateLayerDrag(getPos(e));
        return;
      }

      if (tool === 'eraser') {
        e.preventDefault();
        if (isErasing && e.touches.length === 1) eraseAt(getPos(e));
        return;
      }

      // Drawing mode
      if (e.touches.length === 1) {
        moveBrushCursor(e.touches[0].clientX, e.touches[0].clientY);
        moveDraw(e);
      }
    }, { passive: false });

    canvas.addEventListener('touchend', (e) => {
      if (isPinching && e.touches.length < 2) {
        isPinching = false;
        isPanning = false;
        showBrushCursor(false);
        return;
      }
      if (tool === 'move') {
        isPanning = false;
        return;
      }
      if (tool === 'select') { endLayerDrag(); return; }
      if (tool === 'eraser') { isErasing = false; return; }
      brushCursor.style.display = 'none';
      endDraw(e);
    }, { passive: false });

    canvas.addEventListener('touchcancel', (e) => {
      if (isPinching) {
        isPinching = false;
        isPanning = false;
        showBrushCursor(false);
        return;
      }
      if (tool === 'move') {
        isPanning = false;
        return;
      }
      if (tool === 'select') { endLayerDrag(); return; }

        URL.revokeObjectURL(objectUrl);

        const MAX_PX = 600;
        let w = img.naturalWidth;
        let h = img.naturalHeight;
        if (w > MAX_PX || h > MAX_PX) {
          if (w >= h) { h = Math.round(h * MAX_PX / w); w = MAX_PX; }
          else { w = Math.round(w * MAX_PX / h); h = MAX_PX; }
        }

        const offscreen = document.createElement('canvas');
        offscreen.width = w;
        offscreen.height = h;
        offscreen.getContext('2d').drawImage(img, 0, 0, w, h);

        const dataUrl = offscreen.toDataURL(
          file.type === 'image/png' ? 'image/png' : 'image/jpeg',
          0.85
        );

        const MAX_WORLD = 400;
        let worldW = w;
        let worldH = h;
        if (worldW > MAX_WORLD || worldH > MAX_WORLD) {
          if (worldW >= worldH) { worldH = Math.round(worldH * MAX_WORLD / worldW); worldW = MAX_WORLD; }
          else { worldW = Math.round(worldW * MAX_WORLD / worldH); worldH = MAX_WORLD; }

        const viewCentreY = (canvas.height / 2 - offsetY) / scale;

          type: 'image',
          x: viewCentreX - worldW / 2,
          y: viewCentreY - worldH / 2,
          width: worldW,
          height: worldH,
          dataUrl
        };

        if (saved) {

          document.getElementById('confirm-cancel').removeEventListener('click', onCancel);

        function onOk() { cleanup(true); }

        // Click on the dimmed backdrop (outside the dialog card) cancels.
        function onBackdrop(e) { if (e.target === modal) cleanup(false); }
        function onKey(e) {
          if (e.key === 'Escape') { e.preventDefault(); cleanup(false); }
