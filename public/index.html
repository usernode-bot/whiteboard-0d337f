    // Bounding box of a drawable element in world space, or null when it has
    // none (free-form pen strokes are excluded). Returns {minX,minY,maxX,maxY}.
    function elementBBox(item) {
      if (!item) return null;
      if (item.type === 'shape') {
        return {
          minX: Math.min(item.x0, item.x1), minY: Math.min(item.y0, item.y1),
          maxX: Math.max(item.x0, item.x1), maxY: Math.max(item.y0, item.y1)
        };
      }
      if (item.type === 'image') {
        return { minX: item.x, minY: item.y, maxX: item.x + item.width, maxY: item.y + item.height };
      }
      if (item.type === 'emoji') {
        const h = item.size || EMOJI_SIZE;
        return { minX: item.x - h / 2, minY: item.y - h / 2, maxX: item.x + h / 2, maxY: item.y + h / 2 };
      }
      if (item.type === 'text') {
        const fs = item.fontSize || 16;
        const w = Math.max(1, (item.text ? item.text.length : 1)) * fs * 0.6;
        return { minX: item.x, minY: item.y - fs, maxX: item.x + w, maxY: item.y };
      }
      return null;
    }

    function bboxCenter(b) { return { x: (b.minX + b.maxX) / 2, y: (b.minY + b.maxY) / 2 }; }

    // Topmost (newest) element whose bbox contains world point (wx,wy), or null.
    function hitTestElement(wx, wy) {
      for (let i = strokes.length - 1; i >= 0; i--) {
        const item = strokes[i].stroke_data || strokes[i];
        const b = elementBBox(item);
        if (b && wx >= b.minX && wx <= b.maxX && wy >= b.minY && wy <= b.maxY) {
          return { id: strokes[i].id, center: bboxCenter(b) };
        }
      }
      return null;
    }

    // Current world position of a thread. Anchored threads track their
    // element's bbox centre + stored offset; if the element is gone (deleted
    // or cleared), fall back to the thread's stored absolute x/y.
    function threadWorldPos(t) {
      if (t.anchor_stroke_id != null && t.anchor_dx != null && t.anchor_dy != null) {
        const s = strokes.find((s) => s.id === t.anchor_stroke_id);
        if (s) {
          const b = elementBBox(s.stroke_data || s);
          if (b) {
            const c = bboxCenter(b);
            return { x: c.x + t.anchor_dx, y: c.y + t.anchor_dy };
          }
        }
      }
      return { x: t.x, y: t.y };
    }

    // Reconcile pin DOM with `threads` and reposition every pin from its world
    // coords. Called from redrawAll(), so it runs on every viewport change.
    function updatePins() {
      if (!pinLayer) return;
      for (const [id, el] of pinEls) {
        if (!threads.some((t) => t.id === id)) { el.remove(); pinEls.delete(id); }
      }
      for (const t of threads) {
        let el = pinEls.get(t.id);
        if (!el) {
          el = document.createElement('button');
          el.className = 'absolute -translate-x-1/2 -translate-y-full flex items-center justify-center w-7 h-7 rounded-full rounded-bl-none bg-violet-600 text-white text-[11px] font-medium shadow-lg border-2 border-white dark:border-zinc-800 hover:bg-violet-700 transition-colors';
          el.style.pointerEvents = 'auto';
          el.title = 'Open comment thread';
          el.addEventListener('click', (ev) => { ev.stopPropagation(); openThreadPanel(t.id); });
          pinLayer.appendChild(el);
          pinEls.set(t.id, el);
        }
        const detached = t.anchor_stroke_id == null && (t.anchor_dx != null || t.anchor_dy != null);
        el.classList.toggle('opacity-60', detached);
        el.textContent = String((t.replies && t.replies.length) || 1);
        const wp = threadWorldPos(t);
        const sp = worldToScreen(wp.x, wp.y);
        if (sp.x < -40 || sp.y < -40 || sp.x > window.innerWidth + 40 || sp.y > window.innerHeight + 40) {
          el.style.display = 'none';
        } else {
          el.style.display = 'flex';
          el.style.left = sp.x + 'px';
          el.style.top = sp.y + 'px';
        }
      }
    }

    function positionPopover(el, sx, sy, display) {
      el.classList.remove('hidden');
      el.style.display = display || 'block';
      const rect = el.getBoundingClientRect();
      let left = sx + 12;
      let top = sy + 12;
      if (left + rect.width > window.innerWidth - 8) left = sx - rect.width - 12;
      if (top + rect.height > window.innerHeight - 8) top = window.innerHeight - rect.height - 8;
      el.style.left = Math.max(8, left) + 'px';
      el.style.top = Math.max(8, top) + 'px';
    }

    // --- New-thread composer ---
    function openComposer(screenX, screenY) {
      closeThreadPanel();
      const world = screenToWorld(screenX, screenY);
      composerWorld = world;
      const hit = hitTestElement(world.x, world.y);
      const note = document.getElementById('composer-attach-note');
      if (hit) {
        composerAnchor = { id: hit.id, dx: world.x - hit.center.x, dy: world.y - hit.center.y };
        note.classList.remove('hidden');
      } else {
        composerAnchor = null;
        note.classList.add('hidden');
      }
      const composer = document.getElementById('comment-composer');
      document.getElementById('composer-text').value = '';
      positionPopover(composer, screenX, screenY, 'block');
      document.getElementById('composer-text').focus();
    }

    function hideComposer() {
      const composer = document.getElementById('comment-composer');
      composer.style.display = 'none';
      composer.classList.add('hidden');
      composerWorld = null;
      composerAnchor = null;
    }

    async function submitComposer() {
      const body = document.getElementById('composer-text').value;
      if (!body.trim() || !composerWorld) { hideComposer(); return; }
      const payload = { x: composerWorld.x, y: composerWorld.y, body: body.trim() };
      if (composerAnchor) {
        payload.anchor_stroke_id = composerAnchor.id;
        payload.anchor_dx = composerAnchor.dx;
        payload.anchor_dy = composerAnchor.dy;
      }
      hideComposer();
      try {
        const res = await fetch('/api/threads', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...headers },
          body: JSON.stringify(payload)
        });
        if (res.ok) {
          const thread = await res.json();
          if (!threads.some((t) => t.id === thread.id)) threads.push(thread);
          updatePins();
          openThreadPanel(thread.id);
        } else {
          showStatus('Comment failed');
        }
      } catch (err) {
        console.error('Create thread failed:', err);
        showStatus('Comment failed');
      }
      setActiveTool('pen');
    }

    // --- Open-thread panel ---
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      ));
    }

    function relativeTime(iso) {
      const then = new Date(iso).getTime();
      if (!then) return '';
      const m = Math.floor((Date.now() - then) / 60000);
      if (m < 1) return 'just now';
      if (m < 60) return m + 'm ago';
      const h = Math.floor(m / 60);
      if (h < 24) return h + 'h ago';
      return Math.floor(h / 24) + 'd ago';
    }

    function renderThreadReplies(t) {
      const wrap = document.getElementById('thread-replies');
      wrap.innerHTML = '';
      for (const r of (t.replies || [])) {
        const div = document.createElement('div');
        div.innerHTML =
          '<div class="flex items-baseline gap-2 mb-0.5">' +
            '<span class="text-xs font-medium text-zinc-700 dark:text-zinc-200">' + escapeHtml(r.username) + '</span>' +
            '<span class="text-[10px] text-zinc-400">' + relativeTime(r.created_at) + '</span>' +
          '</div>' +
          '<div class="text-sm text-zinc-700 dark:text-zinc-300 whitespace-pre-wrap break-words">' + escapeHtml(r.body) + '</div>';
        wrap.appendChild(div);
      }
      wrap.scrollTop = wrap.scrollHeight;
    }

    function openThreadPanel(id) {
      const t = threads.find((t) => t.id === id);
      if (!t) return;
      openThreadId = id;
      hideComposer();
      renderThreadReplies(t);
      const delBtn = document.getElementById('thread-delete');
      delBtn.classList.toggle('hidden', !(currentUserId != null && String(t.user_id) === currentUserId));
      document.getElementById('reply-text').value = '';
      const panel = document.getElementById('thread-panel');
      const wp = threadWorldPos(t);
      const sp = worldToScreen(wp.x, wp.y);
      positionPopover(panel, sp.x, sp.y, 'flex');
    }

    function closeThreadPanel() {
      openThreadId = null;
      const panel = document.getElementById('thread-panel');
      panel.style.display = 'none';
      panel.classList.add('hidden');
    }

    async function submitReply() {
      if (openThreadId == null) return;
      const ta = document.getElementById('reply-text');
      const body = ta.value;
      if (!body.trim()) return;
      ta.value = '';
      try {
        const res = await fetch('/api/threads/' + openThreadId + '/replies', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...headers },
          body: JSON.stringify({ body: body.trim() })
        });
        if (res.ok) {
          const reply = await res.json();
          const t = threads.find((t) => t.id === reply.thread_id);
          if (t) {
            t.replies = t.replies || [];
            if (!t.replies.some((r) => r.id === reply.id)) t.replies.push(reply);
            if (openThreadId === t.id) renderThreadReplies(t);
            updatePins();
          }
        } else {
          showStatus('Reply failed');
        }
      } catch (err) {
        console.error('Reply failed:', err);
        showStatus('Reply failed');
      }
    }

    async function deleteOpenThread() {
      if (openThreadId == null) return;
      const id = openThreadId;
      try {
        await fetch('/api/threads/' + id, { method: 'DELETE', headers: { ...headers } });
      } catch (err) {
        console.error('Delete thread failed:', err);
      }
      const idx = threads.findIndex((t) => t.id === id);
      if (idx !== -1) threads.splice(idx, 1);
      closeThreadPanel();
      updatePins();
    }

    document.getElementById('composer-submit').addEventListener('click', submitComposer);
    document.getElementById('composer-cancel').addEventListener('click', () => { hideComposer(); setActiveTool('pen'); });
    document.getElementById('composer-text').addEventListener('keydown', (e) => {
      e.stopPropagation();
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); submitComposer(); }
      else if (e.key === 'Escape') { e.preventDefault(); hideComposer(); setActiveTool('pen'); }
    });
    document.getElementById('reply-submit').addEventListener('click', submitReply);
    document.getElementById('thread-close').addEventListener('click', closeThreadPanel);
    document.getElementById('thread-delete').addEventListener('click', deleteOpenThread);
    document.getElementById('reply-text').addEventListener('keydown', (e) => {
      e.stopPropagation();
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); submitReply(); }
      else if (e.key === 'Escape') { e.preventDefault(); closeThreadPanel(); }
    });

    // Close the open thread panel when clicking outside it (but not on a pin —
    // pin clicks switch panels via their own handler).
    document.addEventListener('mousedown', (e) => {
      const panel = document.getElementById('thread-panel');
      if (openThreadId != null && !panel.contains(e.target) && !e.target.closest('#pin-layer')) {
        closeThreadPanel();
      }
    });

    async function loadThreads() {
      try {
        const res = await fetch('/api/threads', { headers });
        if (!res.ok) return;
        const data = await res.json();
        threads = data.threads || [];
        updatePins();
      } catch (err) {
        console.error('Load threads failed:', err);
      }
    }

    async function saveStroke(strokeData) {
      try {
        const res = await fetch('/api/strokes', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...headers },
          body: JSON.stringify({ stroke_data: strokeData })
        });
        if (res.ok) {
          return await res.json();
        }
      } catch (err) {
        console.error('Save stroke failed:', err);
        showStatus('Save failed');
      }
      return null;
    }

    async function loadStrokes() {
      try {
        const res = await fetch('/api/strokes', { headers });
        if (!res.ok) return;
        const data = await res.json();
        strokes = data.strokes || [];
        undoStack = [];
        redoActions = [];
        updateUndoRedoButtons();
        deselectLayer();
        sortStrokes();
        redrawAll();
        showStatus('Board refreshed');
      } catch (err) {
        console.error('Load failed:', err);
      }
    }

    function connectSSE() {
      const url = '/api/strokes/stream' + (token ? '?token=' + encodeURIComponent(token) : '');
      const es = new EventSource(url);

      es.addEventListener('stroke', (e) => {
        const data = JSON.parse(e.data);
        const exists = strokes.some(s => s.id === data.id);
        if (!exists) {
          const strokeData = typeof data.stroke_data === 'string' ? JSON.parse(data.stroke_data) : data.stroke_data;
          strokes.push({ id: data.id, stroke_data: strokeData, z_index: data.z_index });
          sortStrokes();
          redrawAll();
        }
      });

      es.addEventListener('update', (e) => {
        const data = JSON.parse(e.data);
        const sd = typeof data.stroke_data === 'string' ? JSON.parse(data.stroke_data) : data.stroke_data;
        const layer = strokes.find(s => s.id === data.id);
        if (layer) {
          if (sd) layer.stroke_data = sd;
          if (data.z_index != null) layer.z_index = data.z_index;
          sortStrokes();
          redrawAll();
        }
      });

      es.addEventListener('undo', (e) => {
        const data = JSON.parse(e.data);
        const idx = strokes.findIndex(s => s.id === data.id);
        if (idx !== -1) {
          if (selectedLayer && selectedLayer.id === data.id) deselectLayer();
          strokes.splice(idx, 1);
          redrawAll();
        }
      });

      es.addEventListener('clear', () => {
        strokes = [];
        undoStack = [];
        redoActions = [];
        updateUndoRedoButtons();
        deselectLayer();
        redrawAll();
        // Strokes are gone; re-fetch threads so anchors that the server
        // nulled (ON DELETE SET NULL) are reflected locally.
        loadThreads();
      });

      es.addEventListener('thread', (e) => {
        const data = JSON.parse(e.data);
        if (!threads.some((t) => t.id === data.id)) {
          threads.push(data);
          updatePins();
        }
      });

      es.addEventListener('reply', (e) => {
        const reply = JSON.parse(e.data);
        const t = threads.find((t) => t.id === reply.thread_id);
        if (t) {
          t.replies = t.replies || [];
          if (!t.replies.some((r) => r.id === reply.id)) {
            t.replies.push(reply);
            if (openThreadId === t.id) renderThreadReplies(t);
            updatePins();
          }
        }
      });

      es.addEventListener('thread-delete', (e) => {
        const data = JSON.parse(e.data);
        const idx = threads.findIndex((t) => t.id === data.id);
        if (idx !== -1) {
          threads.splice(idx, 1);
          if (openThreadId === data.id) closeThreadPanel();
          updatePins();
        }
      });

      es.onerror = () => {
        es.close();
        setTimeout(connectSSE, 3000);
      };
    }

    // --- PDF export ---

    function exportToPdf(bgColor) {
      // Redraw without the selection overlay so it isn't baked into the export.
      redrawAll(true);

      // Composite the existing canvas (transparent strokes) over chosen background
      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = canvas.width;
      exportCanvas.height = canvas.height;
      const exportCtx = exportCanvas.getContext('2d');

      if (bgColor !== null) {
        exportCtx.fillStyle = bgColor;
        exportCtx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);
      }
      exportCtx.drawImage(canvas, 0, 0);

      // Restore the on-screen selection overlay (if any).
      redrawAll();

      const dataUrl = exportCanvas.toDataURL('image/png');
      const { jsPDF } = window.jspdf;
      const w = exportCanvas.width;
      const h = exportCanvas.height;
      const orientation = w >= h ? 'landscape' : 'portrait';
      // Convert px to pt (96 dpi screen → 72 pt/inch)
      const wPt = w * 72 / 96;
      const hPt = h * 72 / 96;
      const pdf = new jsPDF({ orientation, unit: 'pt', format: [wPt, hPt] });
      pdf.addImage(dataUrl, 'PNG', 0, 0, wPt, hPt);
      pdf.save('whiteboard.pdf');
    }

    function openExportModal() {
      const modal = document.getElementById('export-modal');
      modal.style.display = 'flex';
      modal.classList.remove('hidden');
    }

    function closeExportModal() {
      const modal = document.getElementById('export-modal');
      modal.style.display = 'none';
      modal.classList.add('hidden');
    }

    document.getElementById('btn-export').addEventListener('click', openExportModal);
    document.getElementById('export-cancel').addEventListener('click', closeExportModal);
    document.getElementById('export-light').addEventListener('click', () => { closeExportModal(); exportToPdf('#ffffff'); });
    document.getElementById('export-dark-bg').addEventListener('click', () => { closeExportModal(); exportToPdf('#18181b'); });
    document.getElementById('export-transparent').addEventListener('click', () => { closeExportModal(); exportToPdf(null); });

    // --- Floating toolbar initialization ---
    const toolbarToggle = document.getElementById('toolbar-toggle');
    const toolbarMenu = document.getElementById('toolbar-menu');

    function initToolbarPosition() {
      const saved = localStorage.getItem('whiteboard-toolbar-pos');
      if (saved) {
        try {
          const pos = JSON.parse(saved);
          // Validate position is within reasonable bounds
          if (pos.x >= 0 && pos.x <= window.innerWidth && pos.y >= 0 && pos.y <= window.innerHeight) {
            toolbarPos = pos;
          } else {
            // Reset if out of bounds
            toolbarPos = { x: window.innerWidth / 2 - 24, y: 12 };
          }
        } catch (_) {
          toolbarPos = { x: window.innerWidth / 2 - 24, y: 12 };
        }
      } else {
        toolbarPos = { x: window.innerWidth / 2 - 24, y: 12 };
      }
      updateToolbarPosition();
    }

    function updateToolbarPosition() {
      toolbarToggle.style.left = toolbarPos.x + 'px';
      toolbarToggle.style.top = toolbarPos.y + 'px';
      toolbarMenu.style.left = toolbarPos.x + 'px';
      toolbarMenu.style.top = (toolbarPos.y + 48) + 'px';
    }

    function closeAllPopovers() {
      document.getElementById('shapes-popover').classList.add('hidden');
      document.getElementById('color-popover').classList.add('hidden');
      document.getElementById('text-popover').classList.add('hidden');
      document.getElementById('bg-popover').classList.add('hidden');
    }

    // Click to toggle menu
    toolbarToggle.addEventListener('click', (e) => {
      toolbarMenu.classList.toggle('hidden');
      e.stopPropagation();
    });

    // Close menu when a tool is selected
    document.querySelectorAll('.toolbar-menu .tool-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        toolbarMenu.classList.add('hidden');
      });
    });

    // Dragging (with threshold to distinguish from click)
    toolbarToggle.addEventListener('mousedown', (e) => {
      toolbarDragStart = { x: e.clientX, y: e.clientY };
      toolbarDragOffset = { x: toolbarPos.x - e.clientX, y: toolbarPos.y - e.clientY };
    });

    document.addEventListener('mousemove', (e) => {
      if (!toolbarDragStart) return;
      const distance = Math.hypot(e.clientX - toolbarDragStart.x, e.clientY - toolbarDragStart.y);
      if (distance < 5) return;
      if (!isToolbarDragging) {
        isToolbarDragging = true;
        toolbarToggle.classList.add('dragging');
        closeAllPopovers();
        toolbarMenu.classList.add('hidden');
      }
      let newX = e.clientX + toolbarDragOffset.x;
      let newY = e.clientY + toolbarDragOffset.y;
      // Clamp to viewport (48px button, 20px margin)
      newX = Math.max(20, Math.min(window.innerWidth - 68, newX));
      newY = Math.max(20, Math.min(window.innerHeight - 68, newY));
      toolbarPos = { x: newX, y: newY };
      updateToolbarPosition();
    });

    document.addEventListener('mouseup', () => {
      if (isToolbarDragging) {
        toolbarToggle.classList.remove('dragging');
        localStorage.setItem('whiteboard-toolbar-pos', JSON.stringify(toolbarPos));
      }
      isToolbarDragging = false;
      toolbarDragStart = null;
    });

    // Touch drag support for mobile
    toolbarToggle.addEventListener('touchstart', (e) => {
      const t = e.touches[0];
      toolbarDragStart = { x: t.clientX, y: t.clientY };
      toolbarDragOffset = { x: toolbarPos.x - t.clientX, y: toolbarPos.y - t.clientY };
    });

    document.addEventListener('touchmove', (e) => {
      if (!toolbarDragStart) return;
      const t = e.touches[0];
      const distance = Math.hypot(t.clientX - toolbarDragStart.x, t.clientY - toolbarDragStart.y);
      if (distance < 5) return;
      if (!isToolbarDragging) {
        isToolbarDragging = true;
        toolbarToggle.classList.add('dragging');
        closeAllPopovers();
        toolbarMenu.classList.add('hidden');
      }
      let newX = t.clientX + toolbarDragOffset.x;
      let newY = t.clientY + toolbarDragOffset.y;
      newX = Math.max(20, Math.min(window.innerWidth - 68, newX));
      newY = Math.max(20, Math.min(window.innerHeight - 68, newY));
      toolbarPos = { x: newX, y: newY };
      updateToolbarPosition();
      e.preventDefault();
    }, { passive: false });

    document.addEventListener('touchend', () => {
      if (isToolbarDragging) {
        toolbarToggle.classList.remove('dragging');
        localStorage.setItem('whiteboard-toolbar-pos', JSON.stringify(toolbarPos));
      }
      isToolbarDragging = false;
      toolbarDragStart = null;
    });

    window.addEventListener('resize', resize);
    updateUndoRedoButtons();
    resize();
    initToolbarPosition();
    loadStrokes();
    loadThreads();
    connectSSE();
  </script>
</body>
</html>
