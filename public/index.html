<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <script>
  // usernode-dev-console@1
  (function () {
    if (window.__usernodeDevConsole) return;
    window.__usernodeDevConsole = true;
    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;
      try {
        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (v instanceof Error) return (v.stack || (v.name + ': ' + v.message));
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (typeof val === 'object' && val !== null) {
            if (seen.has(val)) return '[Circular]';
            seen.add(val);
          }
          if (typeof val === 'function') return '[Function ' + (val.name || 'anonymous') + ']';
          if (val instanceof Error) return val.stack || (val.name + ': ' + val.message);
          return val;
        });
      } catch (e) { try { return String(v); } catch (_) { return '[unserializable]'; } }
    }
    function post(level, args, meta) {
      try {
        var payload = {
          sentinel: S,
          level: level,
          args: Array.prototype.slice.call(args).map(function (a) { return serialize(a); }),
          ts: Date.now(),
          url: location.href,
        };
        if (meta) for (var k in meta) payload[k] = meta[k];
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      } catch (_) {}
    }
    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };
    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Error';
      post('error', [msg], { source: e.filename || '', line: e.lineno || 0, col: e.colno || 0, kind: 'error' });
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var msg = (r && (r.stack || r.message)) || String(r);
      post('error', [msg], { kind: 'unhandledrejection' });
    });
    try { post('info', ['[dev-console ready]'], { kind: 'ready' }); } catch (_) {}
  })();
  </script>

  <title>Marquee</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>

  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }

    @keyframes marquee-scroll {
      0%   { transform: translateX(100vw); }
      100% { transform: translateX(-100%); }
    }

    #marquee-text {
      display: inline-block;
      white-space: nowrap;
      animation: marquee-scroll linear infinite;
      animation-play-state: running;
    }

    #marquee-text.paused {
      animation-play-state: paused;
    }

    .speed-btn.active {
      background: #7c3aed;
      color: white;
    }
    .speed-btn:not(.active):hover {
      background: rgba(124, 58, 237, 0.12);
    }
  </style>
</head>
<body class="bg-zinc-950 flex flex-col h-full">

  <!-- Scrolling band -->
  <div class="flex-1 flex items-center overflow-hidden bg-zinc-950 border-b border-zinc-800">
    <div id="marquee-text"
         class="text-white font-bold tracking-wide select-none"
         style="font-size: clamp(2.5rem, 8vw, 6rem); animation-duration: 15s;">
    </div>
  </div>

  <!-- Input area -->
  <div class="px-6 py-4 bg-zinc-900 border-b border-zinc-800">
    <input
      id="text-input"
      type="text"
      placeholder="Type your message here…"
      class="w-full bg-zinc-800 text-white placeholder-zinc-500 rounded-xl px-5 py-3 text-lg outline-none focus:ring-2 focus:ring-violet-500 border border-zinc-700 transition"
      autocomplete="off"
      spellcheck="false"
    >
  </div>

  <!-- Toolbar -->
  <div class="px-6 py-4 bg-zinc-900 flex flex-wrap items-center gap-3">

    <!-- Play / Pause -->
    <button id="btn-play-pause"
      class="flex items-center gap-2 px-5 py-2.5 rounded-xl bg-violet-600 hover:bg-violet-500 text-white font-semibold text-sm shadow transition">
      <svg id="icon-pause" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <rect x="5" y="4" width="4" height="16" rx="1"/>
        <rect x="15" y="4" width="4" height="16" rx="1"/>
      </svg>
      <svg id="icon-play" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" class="hidden">
        <polygon points="5,3 19,12 5,21"/>
      </svg>
      <span id="play-pause-label">Pause</span>
    </button>

    <div class="w-px h-8 bg-zinc-700"></div>

    <!-- Speed presets -->
    <div class="flex items-center gap-1 bg-zinc-800 rounded-xl p-1 border border-zinc-700">
      <button data-speed="slow" class="speed-btn px-4 py-1.5 rounded-lg text-sm font-medium text-zinc-300 transition">
        Slow
      </button>
      <button data-speed="medium" class="speed-btn active px-4 py-1.5 rounded-lg text-sm font-medium transition">
        Medium
      </button>
      <button data-speed="fast" class="speed-btn px-4 py-1.5 rounded-lg text-sm font-medium text-zinc-300 transition">
        Fast
      </button>
    </div>

    <div class="w-px h-8 bg-zinc-700"></div>

    <!-- Download -->
    <button id="btn-download"
      class="flex items-center gap-2 px-5 py-2.5 rounded-xl bg-zinc-700 hover:bg-zinc-600 text-white font-semibold text-sm shadow transition border border-zinc-600">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      Download .txt
    </button>

  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token') || '';

    const SPEEDS = { slow: 30, medium: 15, fast: 7 };
    let currentSpeed = 'medium';
    let isPlaying = true;

    const marqueeEl = document.getElementById('marquee-text');
    const textInput = document.getElementById('text-input');
    const btnPlayPause = document.getElementById('btn-play-pause');
    const iconPause = document.getElementById('icon-pause');
    const iconPlay = document.getElementById('icon-play');
    const playPauseLabel = document.getElementById('play-pause-label');

    function setMarqueeText(text) {
      marqueeEl.textContent = text || '';
    }

    function applySpeed(speed) {
      currentSpeed = speed;
      const duration = SPEEDS[speed];
      // Reset animation to restart from initial position with new duration
      marqueeEl.style.animationDuration = duration + 's';
      restartAnimation();

      document.querySelectorAll('.speed-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.speed === speed);
        if (btn.dataset.speed !== speed) btn.classList.add('text-zinc-300');
        else btn.classList.remove('text-zinc-300');
      });
    }

    function restartAnimation() {
      // Force reflow to restart the animation cleanly
      marqueeEl.style.animation = 'none';
      marqueeEl.offsetHeight; // trigger reflow
      marqueeEl.style.animation = '';
      marqueeEl.style.animationDuration = SPEEDS[currentSpeed] + 's';
      marqueeEl.classList.toggle('paused', !isPlaying);
    }

    function setPlaying(playing) {
      isPlaying = playing;
      marqueeEl.classList.toggle('paused', !isPlaying);
      iconPause.classList.toggle('hidden', !isPlaying);
      iconPlay.classList.toggle('hidden', isPlaying);
      playPauseLabel.textContent = isPlaying ? 'Pause' : 'Play';
    }

    textInput.addEventListener('input', () => {
      setMarqueeText(textInput.value);
      restartAnimation();
    });

    btnPlayPause.addEventListener('click', () => {
      setPlaying(!isPlaying);
    });

    document.querySelectorAll('.speed-btn').forEach(btn => {
      btn.addEventListener('click', () => applySpeed(btn.dataset.speed));
    });

    document.getElementById('btn-download').addEventListener('click', () => {
      const text = textInput.value;
      const blob = new Blob([text], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'marquee.txt';
      a.click();
      URL.revokeObjectURL(url);
    });

    // Init
    setMarqueeText(textInput.value);
    applySpeed('medium');
    setPlaying(true);
  </script>
</body>
</html>
